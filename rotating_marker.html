<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rotating Match Stick</title>
  <style>
    body { font-family: sans-serif; margin: 20px; background: #f3f3f3; }
    .panel { position: relative; max-width: 760px; margin: 0 auto; background: #fff; padding: 16px; border-radius: 8px; }
    .row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
    canvas { width: 100%; background: #ddd; border-radius: 6px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .pill-btn {
      border: 1px solid #6c6c6c;
      background: #efefef;
      color: #222;
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 13px;
      cursor: pointer;
    }
    .pill-btn.active {
      background: #d8f7dc;
      border-color: #2d9b3e;
      color: #126320;
      font-weight: 700;
    }
    .qr-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border: 2px solid #2c6;
      border-radius: 8px;
      background: #eaffea;
      color: #083;
      font-weight: 700;
      text-decoration: none;
      font-size: 13px;
      line-height: 1.2;
    }
    #navQr {
      width: 140px;
      height: 140px;
      border: 1px solid #222;
      background: #fff;
      object-fit: contain;
    }
    .notice {
      margin-top: 8px;
      padding: 8px 10px;
      border-radius: 6px;
      background: #fffbe6;
      border: 1px solid #e6d78a;
      color: #5a4b00;
      font-size: 12px;
      display: none;
      word-break: break-all;
    }
    .viewer-note {
      margin-top: 8px;
      padding: 8px 10px;
      border-radius: 6px;
      background: #fff0f0;
      border: 1px solid #e3aaaa;
      color: #7a2020;
      font-size: 13px;
      font-weight: 700;
    }
    .menu-link {
      position: absolute;
      top: 12px;
      right: 14px;
      font-size: 13px;
    }
    .menu-link a {
      color: #1f4db8;
      text-decoration: none;
    }
    .menu-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="panel">
    <div class="menu-link"><a href="./pages_index.html">Main Menu</a></div>
    <h2>Rotating Match Stick (Red Tip)</h2>
    <div class="row">
      <label>Rotation: <span id="angleOut" class="mono">131.4°</span></label>
      <input id="angle" type="range" min="0" max="360" step="0.1" value="131.4" style="flex:1; min-width:260px;" />
      <button id="spinBtn" class="pill-btn active" type="button" aria-pressed="true">Spin: On</button>
      <label>Speed: <span id="speedOut" class="mono">21</span>°/s</label>
      <input id="speed" type="range" min="0" max="45" step="1" value="21" />
      <label>Stick Length: <span id="lengthOut" class="mono">66</span>%</label>
      <input id="length" type="range" min="20" max="95" step="1" value="66" />
      <label>Thickness: <span id="thicknessOut" class="mono">16</span>px</label>
      <input id="thickness" type="range" min="2" max="24" step="1" value="16" />
      <a class="qr-link" href="./rotation_detection_edge.html" title="Open camera view">
        <img id="navQr" alt="QR code to open camera view" />
        <span>Click on this QR code to open camera view to detect angle of match stick</span>
      </a>
    </div>
    <div class="viewer-note">Make sure that only the match stick is visible in the camera viewer.</div>
    <div id="qrNotice" class="notice"></div>
    <canvas id="cv" width="720" height="480"></canvas>
  </div>

  <script>
    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');
    const angleEl = document.getElementById('angle');
    const angleOut = document.getElementById('angleOut');
    const spinBtn = document.getElementById('spinBtn');
    const speedEl = document.getElementById('speed');
    const speedOut = document.getElementById('speedOut');
    const lengthEl = document.getElementById('length');
    const lengthOut = document.getElementById('lengthOut');
    const thicknessEl = document.getElementById('thickness');
    const thicknessOut = document.getElementById('thicknessOut');
    const navQr = document.getElementById('navQr');
    const qrLink = document.querySelector('.qr-link');
    const qrNotice = document.getElementById('qrNotice');

    let angle = 0;
    let last = performance.now();
    let autoRotate = true;

    function normalize360(a) {
      let v = a % 360;
      if (v < 0) v += 360;
      return v;
    }

    function displayAngle(a) {
      // Convert image-space clockwise angle to conventional counterclockwise angle.
      return normalize360(360 - a);
    }

    function ccwToImageAngle(a) {
      return normalize360(360 - a);
    }

    function normalizeLanHost(raw) {
      if (!raw) return '';
      const v = String(raw).trim();
      if (!v) return '';
      try {
        if (v.startsWith('http://') || v.startsWith('https://')) return new URL(v).host;
      } catch (e) {}
      return v.replace(/\/+$/, '');
    }

    async function detectLanIpViaWebRTC(timeoutMs = 1200) {
      if (!window.RTCPeerConnection) return null;
      return new Promise((resolve) => {
        let done = false;
        let pc = null;
        const finish = (val) => {
          if (done) return;
          done = true;
          try { if (pc) pc.close(); } catch (e) {}
          resolve(val || null);
        };
        try {
          pc = new RTCPeerConnection({ iceServers: [] });
          pc.createDataChannel('lan-ip');
          pc.onicecandidate = (e) => {
            const c = e && e.candidate && e.candidate.candidate;
            if (!c) return;
            const m = c.match(/(\d+\.\d+\.\d+\.\d+)/);
            if (!m) return;
            const ip = m[1];
            if (isPrivateIp(ip)) finish(ip);
          };
          pc.createOffer()
            .then((offer) => pc.setLocalDescription(offer))
            .catch(() => finish(null));
          setTimeout(() => finish(null), timeoutMs);
        } catch (err) {
          finish(null);
        }
      });
    }

    async function setRealQr() {
      const edgeUrl = new URL('./rotation_detection_edge.html', window.location.href);
      const GH_URL = 'https://bradenripple5.github.io/graycode-reader/rotation_detection_edge.html';
      const params = new URLSearchParams(window.location.search);
      const lanOverride = normalizeLanHost(params.get('lan') || localStorage.getItem('qr_lan_host') || '');
      if (params.get('lan')) {
        try { localStorage.setItem('qr_lan_host', lanOverride); } catch (e) {}
      }

      let targetUrl = edgeUrl.href;
      if (edgeUrl.hostname.endsWith('github.io')) {
        targetUrl = GH_URL;
      } else if (isLikelyLocalHost(edgeUrl.hostname)) {
        if (lanOverride) {
          const proto = edgeUrl.protocol || 'http:';
          targetUrl = `${proto}//${lanOverride}${edgeUrl.pathname}`;
        } else {
          const proto = edgeUrl.protocol || 'http:';
          const port = edgeUrl.port ? `:${edgeUrl.port}` : '';
          const lanIp = await detectLanIpViaWebRTC();
          if (lanIp) targetUrl = `${proto}//${lanIp}${port}${edgeUrl.pathname}`;
          else targetUrl = GH_URL;
        }
      }

      const qrSrc = `https://api.qrserver.com/v1/create-qr-code/?size=320x320&qzone=4&data=${encodeURIComponent(targetUrl)}`;
      navQr.src = qrSrc;
      navQr.title = targetUrl;
      qrLink.dataset.targetUrl = targetUrl;
      qrLink.href = targetUrl;
    }

    function isLikelyLocalHost(host) {
      return host === 'localhost' || host === '127.0.0.1' || host === '0.0.0.0' || host.endsWith('.local');
    }

    function isPrivateIp(host) {
      const m = host.match(/^(\d+)\.(\d+)\.(\d+)\.(\d+)$/);
      if (!m) return false;
      const a = parseInt(m[1], 10), b = parseInt(m[2], 10);
      return a === 10 || (a === 172 && b >= 16 && b <= 31) || (a === 192 && b === 168);
    }

    function showQrNotice(msg) {
      qrNotice.textContent = msg;
      qrNotice.style.display = 'block';
      clearTimeout(showQrNotice._t);
      showQrNotice._t = setTimeout(() => { qrNotice.style.display = 'none'; }, 7000);
    }

    function currentStickParams() {
      const lengthPct = Math.max(20, Math.min(95, parseFloat(lengthEl.value) || 66));
      const lineWidth = Math.max(2, Math.min(24, parseFloat(thicknessEl.value) || 8));
      const halfLen = Math.min(cv.width, cv.height) * 0.5 * (lengthPct / 100);
      const tipRadius = lineWidth * 0.9;
      return { lengthPct, lineWidth, halfLen, tipRadius };
    }

    function drawMarker(deg) {
      ctx.clearRect(0, 0, cv.width, cv.height);
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, cv.width, cv.height);

      const cx = cv.width / 2;
      const cy = cv.height / 2;
      const p = currentStickParams();
      const halfLen = p.halfLen;
      const lineWidth = p.lineWidth;
      const tipRadius = p.tipRadius;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate((deg * Math.PI) / 180);
      ctx.strokeStyle = '#fff';
      ctx.lineCap = 'round';
      ctx.lineWidth = lineWidth;
      ctx.beginPath();
      ctx.moveTo(-halfLen, 0);
      ctx.lineTo(halfLen, 0);
      ctx.stroke();

      // Red tip on the +X end gives direction.
      ctx.fillStyle = '#ff2a2a';
      ctx.beginPath();
      ctx.arc(halfLen, 0, tipRadius, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function tick(ts) {
      const dt = Math.min(0.05, (ts - last) / 1000);
      last = ts;
      const speed = parseFloat(speedEl.value) || 0;
      const p = currentStickParams();
      speedOut.textContent = String(Math.round(speed));
      lengthOut.textContent = String(Math.round(p.lengthPct));
      thicknessOut.textContent = String(Math.round(p.lineWidth));
      if (autoRotate) {
        // Canvas positive rotation is clockwise in image space, so subtract for CCW motion.
        angle = normalize360(angle - dt * speed);
        angleEl.value = displayAngle(angle).toFixed(1);
      } else {
        angle = ccwToImageAngle(parseFloat(angleEl.value) || 0);
      }
      angleOut.textContent = `${displayAngle(angle).toFixed(1)}°`;
      drawMarker(angle);
      requestAnimationFrame(tick);
    }

    angleEl.addEventListener('input', () => {
      if (!autoRotate) angle = ccwToImageAngle(parseFloat(angleEl.value) || 0);
    });

    spinBtn.addEventListener('click', () => {
      autoRotate = !autoRotate;
      spinBtn.classList.toggle('active', autoRotate);
      spinBtn.setAttribute('aria-pressed', autoRotate ? 'true' : 'false');
      spinBtn.textContent = autoRotate ? 'Spin: On' : 'Spin: Off';
    });

    speedEl.addEventListener('input', () => {
    });
    lengthEl.addEventListener('input', () => {
    });
    thicknessEl.addEventListener('input', () => {
    });

    speedEl.value = speedEl.defaultValue;
    lengthEl.value = lengthEl.defaultValue;
    thicknessEl.value = thicknessEl.defaultValue;
    angleEl.value = angleEl.defaultValue;
    angle = ccwToImageAngle(parseFloat(angleEl.value) || 0);

    qrLink.addEventListener('click', (e) => {
      e.preventDefault();
      const targetUrl = qrLink.dataset.targetUrl || new URL('./rotation_detection_edge.html', window.location.href).href;
      let msg = `Opening: ${targetUrl}`;
      try {
        const u = new URL(targetUrl);
        if (isLikelyLocalHost(u.hostname) || isPrivateIp(u.hostname)) {
          msg += ' | Note: phone camera may not open this unless that host is reachable from your phone.';
        }
      } catch (err) {}
      showQrNotice(msg);
      setTimeout(() => { window.location.href = targetUrl; }, 900);
    });

    setRealQr();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
