<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Basic Camera View</title>
    <style>
      :root {
        --bg: #101418;
        --panel: #1a2129;
        --text: #ecf1f6;
        --muted: #a6b4c2;
        --accent: #36a3ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "IBM Plex Sans", "Segoe UI", Arial, sans-serif;
        color: var(--text);
        background: var(--bg);
        display: grid;
        place-items: center;
        padding: 16px;
      }

      .app {
        width: min(960px, 100%);
        background: var(--panel);
        border: 1px solid #293443;
        border-radius: 14px;
        padding: 14px;
      }

      .title {
        margin: 0 0 12px;
        font-size: 20px;
      }

      .controls {
        display: grid;
        gap: 10px;
        margin-bottom: 12px;
      }

      .control-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }

      .control-row label {
        min-width: 90px;
      }

      .repeat-panel {
        border: 1px solid #334255;
        border-radius: 10px;
        padding: 10px;
      }

      .repeat-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .repeat-header strong {
        font-size: 14px;
      }

      #repeatToggleBtn {
        min-width: 34px;
        font-weight: 700;
      }

      .repeat-controls {
        margin-top: 10px;
        display: grid;
        gap: 10px;
      }

      .repeat-controls.collapsed {
        display: none;
      }

      .control-row input[type="range"] {
        width: min(320px, 80vw);
      }

      button,
      select {
        background: #11171f;
        color: var(--text);
        border: 1px solid #334255;
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 14px;
      }

      button {
        cursor: pointer;
      }

      button.primary {
        background: #123a5d;
        border-color: #2b83cc;
      }

      .viewport {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #000;
        border-radius: 10px;
        border: 1px solid #2c3949;
        overflow: hidden;
      }

      video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      .status {
        margin-top: 10px;
        color: var(--muted);
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <h1 class="title">Basic Camera View</h1>

      <div class="controls">
        <div class="control-row">
          <label for="cameraSelect">Camera:</label>
          <select id="cameraSelect"></select>
        </div>
        <div class="control-row">
          <label for="resolutionSelect">Resolution:</label>
          <select id="resolutionSelect">
            <option value="3840x2160">4K (3840x2160)</option>
            <option value="2560x1440">1440p (2560x1440)</option>
            <option value="1920x1080" selected>1080p (1920x1080)</option>
            <option value="1280x720">720p (1280x720)</option>
            <option value="640x480">480p (640x480)</option>
          </select>
        </div>
        <div class="control-row">
          <button id="startBtn" class="primary">Start Camera</button>
          <button id="stopBtn">Stop Camera</button>
        </div>
        <div class="repeat-panel">
          <div class="repeat-header">
            <strong>Row Repeat Finder</strong>
            <button id="repeatToggleBtn" type="button" aria-expanded="false">+</button>
          </div>
          <div id="repeatControls" class="repeat-controls collapsed">
            <div class="control-row">
              <label>
                <input id="enableRowRepeat" type="checkbox" />
                Enable row-repeat scan
              </label>
            </div>
            <div class="control-row">
              <label for="repeatDepth">Consecutive rows (n):</label>
              <input id="repeatDepth" type="range" min="1" max="25" value="5" />
              <span id="repeatDepthValue">5</span>
            </div>
            <div class="control-row">
              <label for="repeatAccuracy">Row accuracy %:</label>
              <input id="repeatAccuracy" type="range" min="40" max="100" value="85" />
              <span id="repeatAccuracyValue">85%</span>
            </div>
          </div>
        </div>
      </div>

      <div class="viewport">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
      </div>

      <div class="status" id="status">Status: Idle</div>
      <div class="status" id="actualResolution">Actual stream: -</div>
    </div>

    <script>
      const video = document.getElementById("video");
      const overlay = document.getElementById("overlay");
      const overlayCtx = overlay.getContext("2d", { willReadFrequently: true });
      const cameraSelect = document.getElementById("cameraSelect");
      const resolutionSelect = document.getElementById("resolutionSelect");
      const startBtn = document.getElementById("startBtn");
      const stopBtn = document.getElementById("stopBtn");
      const repeatToggleBtn = document.getElementById("repeatToggleBtn");
      const repeatControls = document.getElementById("repeatControls");
      const enableRowRepeat = document.getElementById("enableRowRepeat");
      const repeatDepth = document.getElementById("repeatDepth");
      const repeatDepthValue = document.getElementById("repeatDepthValue");
      const repeatAccuracy = document.getElementById("repeatAccuracy");
      const repeatAccuracyValue = document.getElementById("repeatAccuracyValue");
      const statusEl = document.getElementById("status");
      const actualResolutionEl = document.getElementById("actualResolution");

      let stream = null;
      let rafId = 0;
      const processingCanvas = document.createElement("canvas");
      const processingCtx = processingCanvas.getContext("2d", { willReadFrequently: true });

      function setStatus(text) {
        statusEl.textContent = `Status: ${text}`;
      }

      function updateActualResolution() {
        const track = stream && stream.getVideoTracks && stream.getVideoTracks()[0];
        if (!track) {
          actualResolutionEl.textContent = "Actual stream: -";
          return;
        }
        const settings = track.getSettings ? track.getSettings() : {};
        const w = settings.width || video.videoWidth || "-";
        const h = settings.height || video.videoHeight || "-";
        const fps = settings.frameRate ? ` @ ${Math.round(settings.frameRate)}fps` : "";
        actualResolutionEl.textContent = `Actual stream: ${w} x ${h}${fps}`;
      }

      function updateRepeatLabels() {
        repeatDepthValue.textContent = repeatDepth.value;
        repeatAccuracyValue.textContent = `${repeatAccuracy.value}%`;
      }

      function resizeOverlay() {
        const rect = video.getBoundingClientRect();
        overlay.width = Math.max(1, Math.floor(rect.width));
        overlay.height = Math.max(1, Math.floor(rect.height));
      }

      function stopProcessing() {
        if (rafId) {
          cancelAnimationFrame(rafId);
          rafId = 0;
        }
        overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
      }

      function startProcessing() {
        stopProcessing();
        const loop = () => {
          rafId = requestAnimationFrame(loop);
          if (!stream || video.readyState < 2 || !video.videoWidth || !video.videoHeight) return;
          if (!enableRowRepeat.checked) {
            overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
            return;
          }

          const w = video.videoWidth;
          const h = video.videoHeight;
          if (processingCanvas.width !== w || processingCanvas.height !== h) {
            processingCanvas.width = w;
            processingCanvas.height = h;
          }

          processingCtx.drawImage(video, 0, 0, w, h);
          const imageData = processingCtx.getImageData(0, 0, w, h);
          const data = imageData.data;

          const n = Math.max(1, Number(repeatDepth.value) || 1);
          const requiredAccuracy = Math.max(1, Math.min(100, Number(repeatAccuracy.value) || 85));
          const maxPixelDelta = Math.max(2, Math.round(((100 - requiredAccuracy) / 100) * 64) + 4);
          const highlighted = new Uint8Array(w * h);
          const rowMask = new Uint8Array(w);

          const maxY = h - n - 1;
          for (let y = 0; y <= maxY; y += 1) {
            rowMask.fill(0);
            let matchingPixels = 0;

            for (let x = 0; x < w; x += 1) {
              let ok = true;
              for (let step = 0; step < n; step += 1) {
                const idxA = ((y + step) * w + x) * 4;
                const idxB = ((y + step + 1) * w + x) * 4;
                const dr = Math.abs(data[idxA] - data[idxB]);
                const dg = Math.abs(data[idxA + 1] - data[idxB + 1]);
                const db = Math.abs(data[idxA + 2] - data[idxB + 2]);
                const delta = (dr + dg + db) / 3;
                if (delta > maxPixelDelta) {
                  ok = false;
                  break;
                }
              }
              if (!ok) continue;
              rowMask[x] = 1;
              matchingPixels += 1;
            }

            const rowAccuracy = (matchingPixels / w) * 100;
            if (rowAccuracy < requiredAccuracy) continue;

            for (let x = 0; x < w; x += 1) {
              if (!rowMask[x]) continue;
              for (let step = 0; step <= n; step += 1) {
                highlighted[(y + step) * w + x] = 1;
              }
            }
          }

          const scaleX = overlay.width / w;
          const scaleY = overlay.height / h;
          overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
          overlayCtx.fillStyle = "rgba(0, 255, 0, 0.45)";

          for (let y = 0; y < h; y += 1) {
            const rowOffset = y * w;
            let runStart = -1;
            for (let x = 0; x <= w; x += 1) {
              const isOn = x < w ? highlighted[rowOffset + x] === 1 : false;
              if (isOn && runStart < 0) runStart = x;
              if (!isOn && runStart >= 0) {
                overlayCtx.fillRect(
                  runStart * scaleX,
                  y * scaleY,
                  (x - runStart) * scaleX,
                  Math.max(1, scaleY)
                );
                runStart = -1;
              }
            }
          }
        };
        loop();
      }

      async function listCameras() {
        try {
          const devices = await navigator.mediaDevices.enumerateDevices();
          const cams = devices.filter((d) => d.kind === "videoinput");
          cameraSelect.innerHTML = "";

          const autoOpt = document.createElement("option");
          autoOpt.value = "";
          autoOpt.textContent = "Auto (Rear Camera)";
          cameraSelect.appendChild(autoOpt);

          if (!cams.length) {
            cameraSelect.value = "";
            return;
          }

          cams.forEach((cam, i) => {
            const opt = document.createElement("option");
            opt.value = cam.deviceId;
            opt.textContent = cam.label || `Camera ${i + 1}`;
            cameraSelect.appendChild(opt);
          });
          cameraSelect.value = "";
        } catch (err) {
          console.error(err);
          setStatus("Could not list cameras");
        }
      }

      async function startCamera() {
        try {
          stopCamera();
          const [width, height] = (resolutionSelect.value || "1920x1080")
            .split("x")
            .map((n) => Number(n) || 0);

          const selectedId = cameraSelect.value;
          const videoConstraints = {
            width: { ideal: width || 1920 },
            height: { ideal: height || 1080 }
          };

          if (selectedId) {
            videoConstraints.deviceId = { exact: selectedId };
          } else {
            videoConstraints.facingMode = { ideal: "environment" };
          }

          stream = await navigator.mediaDevices.getUserMedia({
            video: videoConstraints,
            audio: false
          });

          video.srcObject = stream;
          await video.play();
          resizeOverlay();
          updateActualResolution();
          startProcessing();
          setStatus("Camera running");
        } catch (err) {
          console.error(err);
          setStatus(`Camera error: ${err.message}`);
          stopCamera();
        }
      }

      function stopCamera() {
        stopProcessing();
        if (stream) {
          stream.getTracks().forEach((track) => track.stop());
          stream = null;
        }
        video.srcObject = null;
        updateActualResolution();
        setStatus("Stopped");
      }

      startBtn.addEventListener("click", startCamera);
      stopBtn.addEventListener("click", stopCamera);
      repeatToggleBtn.addEventListener("click", () => {
        const collapsed = repeatControls.classList.toggle("collapsed");
        repeatToggleBtn.textContent = collapsed ? "+" : "-";
        repeatToggleBtn.setAttribute("aria-expanded", collapsed ? "false" : "true");
      });
      enableRowRepeat.addEventListener("change", () => {
        if (!stream) return;
        startProcessing();
      });
      repeatDepth.addEventListener("input", updateRepeatLabels);
      repeatAccuracy.addEventListener("input", updateRepeatLabels);
      resolutionSelect.addEventListener("change", () => {
        if (!stream) return;
        startCamera();
      });
      cameraSelect.addEventListener("change", () => {
        if (!stream) return;
        startCamera();
      });

      navigator.mediaDevices.addEventListener("devicechange", listCameras);
      video.addEventListener("loadedmetadata", () => {
        updateActualResolution();
        resizeOverlay();
      });
      window.addEventListener("resize", resizeOverlay);

      updateRepeatLabels();
      listCameras()
        .then(() => startCamera())
        .catch(() => setStatus("No camera access"));
    </script>
  </body>
</html>
