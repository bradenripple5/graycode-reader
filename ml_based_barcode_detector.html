<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Camera Crop Preview</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap");
      :root {
        --bg: #0b0e16;
        --panel: #111726;
        --panel-2: #0f1420;
        --accent: #ffd84d;
        --text: #e9eef7;
        --muted: #9fb0c8;
        --danger: #ff6b6b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Space Grotesk", "Segoe UI", Arial, sans-serif;
        color: var(--text);
        background: radial-gradient(900px 700px at 15% 10%, #1b2340 0%, var(--bg) 60%);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
      }
      .app {
        width: min(1200px, 96vw);
        background: linear-gradient(180deg, #131a2b 0%, #0b0e16 100%);
        border: 1px solid #1b2437;
        border-radius: 20px;
        padding: 18px;
        box-shadow: 0 24px 60px rgba(3, 6, 12, 0.6);
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }
      .title {
        font-size: 18px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-weight: 700;
      }
      .subtitle {
        color: var(--muted);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-top: 4px;
      }
      .controls {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      button, select, input[type="range"], input[type="file"] {
        background: var(--panel);
        color: var(--text);
        border: 1px solid #253047;
        border-radius: 12px;
        padding: 8px 12px;
        font-size: 13px;
        font-family: inherit;
      }
      button.primary {
        background: linear-gradient(135deg, #ffd84d 0%, #ffb020 100%);
        border-color: #ffd84d;
        color: #0b0e16;
        font-weight: 700;
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 2fr) minmax(300px, 1fr);
        gap: 16px;
      }
      .viewport-wrap {
        display: grid;
        gap: 12px;
      }
      .viewport {
        position: relative;
        aspect-ratio: 16 / 9;
        background: #0a0f18;
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid #1c2638;
        touch-action: none;
      }
      video, img, canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #imageSource { display: none; }
      #overlay { pointer-events: none; }
      .crop-preview {
        position: relative;
        aspect-ratio: 16 / 9;
        background: #0a0f18;
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid #1c2638;
      }
      #cropCanvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .panel {
        background: var(--panel-2);
        border: 1px solid #1b2437;
        border-radius: 16px;
        padding: 14px;
        display: grid;
        gap: 10px;
      }
      .panel h3 {
        margin: 0;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--muted);
      }
      .status {
        font-size: 13px;
        color: var(--muted);
      }
      .status strong { color: var(--text); }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .range-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        align-items: center;
      }
      .mono {
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        color: #7ee5ff;
      }
      .small {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.5;
      }
      .danger { color: var(--danger); }
      @media (max-width: 900px) {
        .layout { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="header">
        <div>
          <div class="title">Camera Crop Preview</div>
          <div class="subtitle">No YOLO | Upload + Live Camera Crop Window</div>
        </div>
        <div class="controls">
          <select id="sourceMode">
            <option value="camera" selected>Camera</option>
            <option value="upload">Uploaded File</option>
          </select>
          <select id="cameraSelect"></select>
          <button id="startBtn" class="primary">Start Camera</button>
          <button id="stopBtn">Stop</button>
        </div>
      </div>

      <div class="layout">
        <div class="viewport-wrap">
          <div class="viewport" id="viewport">
            <video id="video" autoplay playsinline muted></video>
            <img id="imageSource" alt="Uploaded" />
            <canvas id="overlay"></canvas>
          </div>
          <div class="crop-preview">
            <canvas id="cropCanvas"></canvas>
          </div>
        </div>

        <div class="panel">
          <h3>Source</h3>
          <input id="uploadFile" type="file" accept="image/*,video/*" />
          <div class="small">Upload an image or video and switch source to <strong>Uploaded File</strong>.</div>

          <h3>Crop Window</h3>
          <div class="range-row">
            <label>Width</label>
            <div>
              <input id="cropWidth" type="range" min="10" max="100" value="60" />
              <span class="mono" id="cropWidthVal">60%</span>
            </div>
          </div>
          <div class="range-row">
            <label>Height</label>
            <div>
              <input id="cropHeight" type="range" min="10" max="100" value="60" />
              <span class="mono" id="cropHeightVal">60%</span>
            </div>
          </div>
          <div class="range-row">
            <label>Upscale</label>
            <div>
              <input id="upscaleFactor" type="range" min="1" max="6" value="2" />
              <span class="mono" id="upscaleFactorVal">2x</span>
            </div>
          </div>
          <div class="small">Drag the yellow box directly on the preview to move its center.</div>
          <button id="savePngBtn" class="primary">Download PNG</button>

          <h3>Status</h3>
          <div class="status" id="status">Status: <strong>Idle</strong></div>
          <div class="status" id="cropInfo">Crop: <strong>—</strong></div>
          <div class="status" id="centerInfo">Center: <strong>—</strong></div>
          <div class="status" id="outputInfo">Output: <strong>—</strong></div>
          <div class="small danger" id="warning"></div>
        </div>
      </div>
    </div>

    <script>
      const sourceModeEl = document.getElementById("sourceMode");
      const cameraSelect = document.getElementById("cameraSelect");
      const startBtn = document.getElementById("startBtn");
      const stopBtn = document.getElementById("stopBtn");
      const uploadFileEl = document.getElementById("uploadFile");
      const video = document.getElementById("video");
      const imageSource = document.getElementById("imageSource");
      const viewport = document.getElementById("viewport");
      const overlay = document.getElementById("overlay");
      const overlayCtx = overlay.getContext("2d");
      const cropCanvas = document.getElementById("cropCanvas");
      const cropCtx = cropCanvas.getContext("2d");
      const statusEl = document.getElementById("status");
      const cropInfoEl = document.getElementById("cropInfo");
      const centerInfoEl = document.getElementById("centerInfo");
      const outputInfoEl = document.getElementById("outputInfo");
      const warningEl = document.getElementById("warning");
      const savePngBtn = document.getElementById("savePngBtn");
      const cropWidthEl = document.getElementById("cropWidth");
      const cropHeightEl = document.getElementById("cropHeight");
      const cropWidthValEl = document.getElementById("cropWidthVal");
      const cropHeightValEl = document.getElementById("cropHeightVal");
      const upscaleFactorEl = document.getElementById("upscaleFactor");
      const upscaleFactorValEl = document.getElementById("upscaleFactorVal");

      const frameCanvas = document.createElement("canvas");
      const frameCtx = frameCanvas.getContext("2d", { willReadFrequently: true });
      let rafId = 0;
      let stream = null;
      let activeUploadUrl = "";
      let dragActive = false;

      const cropState = {
        centerX: 0.5,
        centerY: 0.5
      };
      const COOKIE_DAYS = 30;
      const COOKIE_PREFIX = "crop_preview_";

      function setCookie(name, value, days = COOKIE_DAYS) {
        const expires = new Date(Date.now() + days * 864e5).toUTCString();
        document.cookie = `${name}=${encodeURIComponent(value)}; expires=${expires}; path=/; SameSite=Lax`;
      }

      function getCookie(name) {
        const parts = document.cookie ? document.cookie.split("; ") : [];
        for (let i = 0; i < parts.length; i++) {
          const entry = parts[i];
          const eq = entry.indexOf("=");
          if (eq < 0) continue;
          const key = entry.slice(0, eq);
          if (key === name) return decodeURIComponent(entry.slice(eq + 1));
        }
        return "";
      }

      function persistCropSettings() {
        setCookie(`${COOKIE_PREFIX}crop_width`, cropWidthEl.value);
        setCookie(`${COOKIE_PREFIX}crop_height`, cropHeightEl.value);
        setCookie(`${COOKIE_PREFIX}upscale_factor`, upscaleFactorEl.value);
        setCookie(`${COOKIE_PREFIX}source_mode`, sourceModeEl.value);
        setCookie(`${COOKIE_PREFIX}center_x`, cropState.centerX.toFixed(6));
        setCookie(`${COOKIE_PREFIX}center_y`, cropState.centerY.toFixed(6));
      }

      function restoreCropSettings() {
        const savedWidth = getCookie(`${COOKIE_PREFIX}crop_width`);
        const savedHeight = getCookie(`${COOKIE_PREFIX}crop_height`);
        const savedUpscale = getCookie(`${COOKIE_PREFIX}upscale_factor`);
        const savedMode = getCookie(`${COOKIE_PREFIX}source_mode`);
        const savedCenterX = getCookie(`${COOKIE_PREFIX}center_x`);
        const savedCenterY = getCookie(`${COOKIE_PREFIX}center_y`);

        if (savedWidth) cropWidthEl.value = savedWidth;
        if (savedHeight) cropHeightEl.value = savedHeight;
        if (savedUpscale) upscaleFactorEl.value = savedUpscale;
        if (savedMode === "camera" || savedMode === "upload") sourceModeEl.value = savedMode;
        if (savedCenterX) {
          const parsed = Number(savedCenterX);
          if (Number.isFinite(parsed)) cropState.centerX = Math.max(0, Math.min(1, parsed));
        }
        if (savedCenterY) {
          const parsed = Number(savedCenterY);
          if (Number.isFinite(parsed)) cropState.centerY = Math.max(0, Math.min(1, parsed));
        }
      }

      function setStatus(text) {
        statusEl.innerHTML = `Status: <strong>${text}</strong>`;
      }

      function updateSliderText() {
        cropWidthValEl.textContent = `${cropWidthEl.value}%`;
        cropHeightValEl.textContent = `${cropHeightEl.value}%`;
        upscaleFactorValEl.textContent = `${upscaleFactorEl.value}x`;
      }

      function pickBackCameraId(cams) {
        const labelMatch = cams.find((cam) => /back|rear|environment/i.test(cam.label));
        return labelMatch ? labelMatch.deviceId : (cams[0] ? cams[0].deviceId : "");
      }

      async function listCameras() {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const cams = devices.filter((d) => d.kind === "videoinput");
        cameraSelect.innerHTML = "";
        cams.forEach((cam, idx) => {
          const opt = document.createElement("option");
          opt.value = cam.deviceId;
          opt.textContent = cam.label || `Camera ${idx + 1}`;
          cameraSelect.appendChild(opt);
        });
        const preferred = pickBackCameraId(cams);
        if (preferred) cameraSelect.value = preferred;
      }

      async function startCamera() {
        stopCamera();
        const devices = await navigator.mediaDevices.enumerateDevices();
        const cams = devices.filter((d) => d.kind === "videoinput");
        const preferredId = pickBackCameraId(cams);
        const deviceId = cameraSelect.value || preferredId || undefined;
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            deviceId,
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        setSourceVisibility();
        resizeCanvases();
        setStatus("Camera active");
        startLoop();
      }

      function stopCamera() {
        if (stream) {
          stream.getTracks().forEach((t) => t.stop());
          stream = null;
        }
        video.srcObject = null;
        if (sourceModeEl.value === "camera") {
          setStatus("Idle");
        }
      }

      function stopLoop() {
        if (rafId) cancelAnimationFrame(rafId);
        rafId = 0;
      }

      function startLoop() {
        stopLoop();
        rafId = requestAnimationFrame(tick);
      }

      function activeSourceSize() {
        if (sourceModeEl.value === "upload" && imageSource.style.display !== "none" && imageSource.naturalWidth) {
          return { width: imageSource.naturalWidth, height: imageSource.naturalHeight, type: "image" };
        }
        if (sourceModeEl.value === "upload" && video.readyState >= 2 && video.videoWidth) {
          return { width: video.videoWidth, height: video.videoHeight, type: "video" };
        }
        if (video.readyState >= 2 && video.videoWidth) {
          return { width: video.videoWidth, height: video.videoHeight, type: "video" };
        }
        return { width: 0, height: 0, type: "none" };
      }

      function resizeCanvases() {
        const { width, height } = activeSourceSize();
        overlay.width = width || 1280;
        overlay.height = height || 720;
        cropCanvas.width = width || 1280;
        cropCanvas.height = height || 720;
      }

      function getCropRect(width, height) {
        const cropW = Math.max(8, Math.floor(width * (Number(cropWidthEl.value) / 100)));
        const cropH = Math.max(8, Math.floor(height * (Number(cropHeightEl.value) / 100)));
        const minCx = cropW / 2;
        const minCy = cropH / 2;
        const maxCx = width - cropW / 2;
        const maxCy = height - cropH / 2;
        const cx = Math.max(minCx, Math.min(maxCx, cropState.centerX * width));
        const cy = Math.max(minCy, Math.min(maxCy, cropState.centerY * height));
        const x = Math.round(cx - cropW / 2);
        const y = Math.round(cy - cropH / 2);
        return { x, y, w: cropW, h: cropH, cx: Math.round(cx), cy: Math.round(cy) };
      }

      function drawOverlay(width, height, rect) {
        overlayCtx.clearRect(0, 0, width, height);
        overlayCtx.fillStyle = "rgba(0, 0, 0, 0.35)";
        overlayCtx.fillRect(0, 0, width, height);
        overlayCtx.clearRect(rect.x, rect.y, rect.w, rect.h);

        overlayCtx.strokeStyle = "#ffd84d";
        overlayCtx.lineWidth = 3;
        overlayCtx.setLineDash([10, 6]);
        overlayCtx.strokeRect(rect.x, rect.y, rect.w, rect.h);
        overlayCtx.setLineDash([]);

        overlayCtx.strokeStyle = "#ffd84d";
        overlayCtx.lineWidth = 2;
        overlayCtx.beginPath();
        overlayCtx.moveTo(rect.cx - 14, rect.cy);
        overlayCtx.lineTo(rect.cx + 14, rect.cy);
        overlayCtx.moveTo(rect.cx, rect.cy - 14);
        overlayCtx.lineTo(rect.cx, rect.cy + 14);
        overlayCtx.stroke();
      }

      function drawCrop(width, height, rect, sourceType) {
        frameCanvas.width = width;
        frameCanvas.height = height;

        if (sourceType === "image") {
          frameCtx.drawImage(imageSource, 0, 0, width, height);
        } else {
          frameCtx.drawImage(video, 0, 0, width, height);
        }

        const requestedFactor = Number(upscaleFactorEl.value);
        const maxDimension = 4096;
        const maxFactorByW = Math.max(1, Math.floor(maxDimension / Math.max(1, rect.w)));
        const maxFactorByH = Math.max(1, Math.floor(maxDimension / Math.max(1, rect.h)));
        const effectiveFactor = Math.max(1, Math.min(requestedFactor, maxFactorByW, maxFactorByH));
        const outW = Math.max(1, rect.w * effectiveFactor);
        const outH = Math.max(1, rect.h * effectiveFactor);

        cropCanvas.width = outW;
        cropCanvas.height = outH;
        cropCtx.imageSmoothingEnabled = true;
        cropCtx.imageSmoothingQuality = "high";
        cropCtx.clearRect(0, 0, outW, outH);
        cropCtx.drawImage(
          frameCanvas,
          rect.x, rect.y, rect.w, rect.h,
          0, 0, outW, outH
        );

        outputInfoEl.innerHTML = `Output: <strong>${outW} x ${outH}</strong>`;
        if (effectiveFactor !== requestedFactor) {
          warningEl.textContent = `Upscale limited to ${effectiveFactor}x to stay within ${maxDimension}px canvas size.`;
        } else {
          warningEl.textContent = "";
        }
      }

      function tick() {
        const source = activeSourceSize();
        if (source.width && source.height) {
          resizeCanvases();
          const rect = getCropRect(source.width, source.height);
          drawOverlay(source.width, source.height, rect);
          drawCrop(source.width, source.height, rect, source.type);
          cropInfoEl.innerHTML = `Crop: <strong>${rect.w} x ${rect.h}</strong>`;
          centerInfoEl.innerHTML = `Center: <strong>${rect.cx}, ${rect.cy}</strong>`;
        }
        rafId = requestAnimationFrame(tick);
      }

      function setSourceVisibility() {
        const useUpload = sourceModeEl.value === "upload";
        if (!useUpload) {
          imageSource.style.display = "none";
          video.style.display = "block";
          if (!stream) setStatus("Camera not started");
          return;
        }

        if (imageSource.src) {
          imageSource.style.display = "block";
          video.style.display = "none";
          setStatus("Using uploaded image");
          return;
        }

        if (video.srcObject || (video.src && !video.srcObject)) {
          imageSource.style.display = "none";
          video.style.display = "block";
          setStatus("Using uploaded video");
          return;
        }

        setStatus("Upload a file to preview");
      }

      function clampAndSetCenter(normX, normY) {
        cropState.centerX = Math.max(0, Math.min(1, normX));
        cropState.centerY = Math.max(0, Math.min(1, normY));
        persistCropSettings();
      }

      function pointerToNorm(evt) {
        const rect = viewport.getBoundingClientRect();
        const x = (evt.clientX - rect.left) / rect.width;
        const y = (evt.clientY - rect.top) / rect.height;
        return { x, y };
      }

      function handlePointerDown(evt) {
        dragActive = true;
        viewport.setPointerCapture(evt.pointerId);
        const p = pointerToNorm(evt);
        clampAndSetCenter(p.x, p.y);
      }

      function handlePointerMove(evt) {
        if (!dragActive) return;
        const p = pointerToNorm(evt);
        clampAndSetCenter(p.x, p.y);
      }

      function handlePointerUp(evt) {
        dragActive = false;
        viewport.releasePointerCapture(evt.pointerId);
      }

      async function loadUpload(file) {
        warningEl.textContent = "";
        if (!file) return;
        if (activeUploadUrl) {
          URL.revokeObjectURL(activeUploadUrl);
          activeUploadUrl = "";
        }

        const url = URL.createObjectURL(file);
        activeUploadUrl = url;
        const isImage = file.type.startsWith("image/");
        const isVideo = file.type.startsWith("video/");

        if (isImage) {
          stopCamera();
          video.pause();
          video.removeAttribute("src");
          video.load();
          imageSource.src = url;
          await imageSource.decode();
          sourceModeEl.value = "upload";
          setSourceVisibility();
          setStatus("Uploaded image loaded");
          return;
        }

        if (isVideo) {
          stopCamera();
          imageSource.removeAttribute("src");
          imageSource.style.display = "none";
          video.srcObject = null;
          video.src = url;
          video.loop = true;
          video.muted = true;
          await video.play();
          sourceModeEl.value = "upload";
          setSourceVisibility();
          setStatus("Uploaded video loaded");
          return;
        }

        warningEl.textContent = "Unsupported file type. Use image or video.";
      }

      sourceModeEl.addEventListener("change", () => {
        setSourceVisibility();
        persistCropSettings();
      });

      uploadFileEl.addEventListener("change", async (e) => {
        try {
          await loadUpload(e.target.files[0]);
        } catch (err) {
          console.error(err);
          warningEl.textContent = "Failed to load file.";
        }
      });

      cropWidthEl.addEventListener("input", () => {
        updateSliderText();
        persistCropSettings();
      });
      cropHeightEl.addEventListener("input", () => {
        updateSliderText();
        persistCropSettings();
      });
      upscaleFactorEl.addEventListener("input", () => {
        updateSliderText();
        persistCropSettings();
      });

      savePngBtn.addEventListener("click", () => {
        if (!cropCanvas.width || !cropCanvas.height) {
          warningEl.textContent = "No processed frame available yet.";
          return;
        }
        const stamp = new Date().toISOString().replace(/[:.]/g, "-");
        const link = document.createElement("a");
        link.href = cropCanvas.toDataURL("image/png");
        link.download = `processed_crop_${stamp}.png`;
        link.click();
      });

      startBtn.addEventListener("click", async () => {
        try {
          sourceModeEl.value = "camera";
          await startCamera();
          setSourceVisibility();
        } catch (err) {
          console.error(err);
          warningEl.textContent = "Could not start camera.";
          setStatus("Camera error");
        }
      });

      stopBtn.addEventListener("click", () => {
        stopCamera();
      });

      viewport.addEventListener("pointerdown", handlePointerDown);
      viewport.addEventListener("pointermove", handlePointerMove);
      viewport.addEventListener("pointerup", handlePointerUp);
      viewport.addEventListener("pointercancel", handlePointerUp);
      window.addEventListener("resize", resizeCanvases);

      navigator.mediaDevices.addEventListener("devicechange", listCameras);
      listCameras().catch(() => {
        warningEl.textContent = "Could not list cameras. Permission may be required.";
      });

      restoreCropSettings();
      updateSliderText();
      setStatus("Idle");
      setSourceVisibility();
      startLoop();
    </script>
  </body>
</html>
