<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Barcode Finder</title>
    <style>
      :root {
        --bg: #0b0d10;
        --panel: #12161b;
        --accent: #19c37d;
        --text: #e8edf2;
        --muted: #9aa6b2;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "IBM Plex Sans", "Segoe UI", Arial, sans-serif;
        color: var(--text);
        background: radial-gradient(1200px 800px at 20% -10%, #1a2028 0%, var(--bg) 55%);
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .app {
        width: min(1000px, 96vw);
        background: linear-gradient(180deg, #11161d 0%, #0d1117 100%);
        border: 1px solid #1d2630;
        border-radius: 18px;
        padding: 18px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }
      .title {
        font-size: 18px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 700;
      }
      .controls {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      button, select {
        background: var(--panel);
        color: var(--text);
        border: 1px solid #273140;
        border-radius: 10px;
        padding: 8px 12px;
        font-size: 14px;
        cursor: pointer;
      }
      button.primary {
        background: #0f2b22;
        border-color: #1f6f4a;
        color: #c7f7e1;
      }
      .viewport {
        position: relative;
        aspect-ratio: 16 / 9;
        background: #0a0f14;
        border-radius: 14px;
        overflow: hidden;
        border: 1px solid #1b2430;
      }
      video, canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .hud {
        position: absolute;
        inset: 12px;
        border: 2px dashed rgba(25, 195, 125, 0.35);
        border-radius: 12px;
        pointer-events: none;
      }
      .status {
        margin-top: 10px;
        color: var(--muted);
        font-size: 13px;
      }
      .checkbox-row {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .checkbox-row label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--muted);
      }
      .green { color: #3de288; }
      .red { color: #ff6b6b; }
      .status strong { color: var(--text); }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="header">
        <div class="title">Barcode Finder</div>
        <div class="controls">
          <select id="cameraSelect"></select>
          <button id="startBtn" class="primary">Start Camera</button>
          <button id="stopBtn">Stop</button>
        </div>
      </div>

      <div class="status green" id="zxingOutput">ZXing: <strong>—</strong></div>

      <div class="viewport">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
        <div class="hud"></div>
      </div>

      <div class="status red" id="customOutput">Custom: <strong>—</strong></div>

      <div class="controls">
        <div class="checkbox-row">
          <label><input id="useZXing" type="checkbox" checked /> ZXing</label>
          <label><input id="useCustom" type="checkbox" checked /> Custom</label>
        </div>
        <label>
          Rows to compare
          <input id="rowCompareCount" type="range" min="2" max="30" value="10" />
          <span id="rowCompareCountVal">10</span>
        </label>
        <label>
          Intensity threshold
          <input id="intensityThreshold" type="range" min="0" max="255" value="128" />
          <span id="intensityThresholdVal">128</span>
        </label>
        <div class="status" id="countReadout">Matching rows: <strong>—</strong></div>
      </div>

      <div class="status" id="status">Status: <strong>Idle</strong></div>
    </div>

    <script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
    <script>
      const video = document.getElementById("video");
      const overlay = document.getElementById("overlay");
      const overlayCtx = overlay.getContext("2d");
      const statusEl = document.getElementById("status");
      const zxingOutputEl = document.getElementById("zxingOutput");
      const customOutputEl = document.getElementById("customOutput");
      const cameraSelect = document.getElementById("cameraSelect");
      const startBtn = document.getElementById("startBtn");
      const stopBtn = document.getElementById("stopBtn");
      const useZXingEl = document.getElementById("useZXing");
      const useCustomEl = document.getElementById("useCustom");
      const rowCompareCountEl = document.getElementById("rowCompareCount");
      const rowCompareCountVal = document.getElementById("rowCompareCountVal");
      const intensityThresholdEl = document.getElementById("intensityThreshold");
      const intensityThresholdVal = document.getElementById("intensityThresholdVal");
      const countReadoutEl = document.getElementById("countReadout");

      let stream = null;
      let rafId = 0;
      let zxingReader = null;
      let pendingZXing = false;
      let lastDecodeTime = 0;
      const decodeIntervalMs = 300;

      const bandHeight = 50;
      const frameCanvas = document.createElement("canvas");
      const frameCtx = frameCanvas.getContext("2d", { willReadFrequently: true });
      const vizCanvas = document.createElement("canvas");
      const vizCtx = vizCanvas.getContext("2d", { willReadFrequently: true });

      let prevBand = null;

      const L_CODES = {
        "0001101": "0",
        "0011001": "1",
        "0010011": "2",
        "0111101": "3",
        "0100011": "4",
        "0110001": "5",
        "0101111": "6",
        "0111011": "7",
        "0110111": "8",
        "0001011": "9"
      };
      const R_CODES = {
        "1110010": "0",
        "1100110": "1",
        "1101100": "2",
        "1000010": "3",
        "1011100": "4",
        "1001110": "5",
        "1010000": "6",
        "1000100": "7",
        "1001000": "8",
        "1110100": "9"
      };

      function decodeUpcFromModules(bits) {
        if (bits.length !== 95) return null;
        const start = bits.slice(0, 3).join("");
        const middle = bits.slice(45, 50).join("");
        const end = bits.slice(92, 95).join("");
        if (start !== "101" || middle !== "01010" || end !== "101") return null;

        let digits = "";
        for (let i = 0; i < 6; i++) {
          const seg = bits.slice(3 + i * 7, 3 + (i + 1) * 7).join("");
          const d = L_CODES[seg];
          if (d === undefined) return null;
          digits += d;
        }
        for (let i = 0; i < 6; i++) {
          const seg = bits.slice(50 + i * 7, 50 + (i + 1) * 7).join("");
          const d = R_CODES[seg];
          if (d === undefined) return null;
          digits += d;
        }

        // UPC-A checksum: (3*sum odd positions + sum even positions) % 10 must be 0
        const nums = digits.split("").map(n => parseInt(n, 10));
        const oddSum = nums[0] + nums[2] + nums[4] + nums[6] + nums[8] + nums[10];
        const evenSum = nums[1] + nums[3] + nums[5] + nums[7] + nums[9] + nums[11];
        const checksum = (oddSum * 3 + evenSum) % 10;
        if (checksum !== 0) return null;

        return digits;
      }

      // ===== New chunk-based UPC finder helpers =====

      function grayscaleAt(data, idx) {
        return data[idx] * 0.299 + data[idx + 1] * 0.587 + data[idx + 2] * 0.114;
      }

      function buildModulesForRow(imageData, width, y, x0 = 0, x1 = width, threshold = 128) {
        const runs = [];
        let current = null;
        let runStart = x0;

        for (let x = x0; x < x1; x++) {
          const i = (y * width + x) * 4;
          const g = grayscaleAt(imageData, i);
          const bit = g < threshold ? 1 : 0;

          if (current === null) {
            current = bit;
            runStart = x;
          } else if (bit !== current) {
            runs.push({ bit: current, start: runStart, end: x - 1, len: x - runStart });
            current = bit;
            runStart = x;
          }
        }
        if (current !== null) {
          runs.push({ bit: current, start: runStart, end: x1 - 1, len: x1 - runStart });
        }

        const lens = runs.map(r => r.len).filter(l => l > 0).sort((a, b) => a - b);
        if (lens.length < 10) return null;

        const k = Math.min(12, lens.length);
        let baseModule = 0;
        for (let i = 0; i < k; i++) baseModule += lens[i];
        baseModule = Math.max(1, Math.round(baseModule / k));

        let modules = "";
        const moduleX = [];

        for (const r of runs) {
          const count = Math.max(1, Math.round(r.len / baseModule));
          for (let j = 0; j < count; j++) {
            modules += (r.bit ? "1" : "0");
            const xCenter = r.start + baseModule * (j + 0.5);
            moduleX.push(xCenter);
          }
        }

        return { modules, moduleX, baseModule, x0, x1, threshold };
      }

      function buildBitsForRow(imageData, width, y, threshold) {
        const bits = new Uint8Array(width);
        for (let x = 0; x < width; x++) {
          const i = (y * width + x) * 4;
          const g = grayscaleAt(imageData, i);
          bits[x] = g < threshold ? 1 : 0;
        }
        return bits;
      }

      function findBestRowMatchSegment(imageData, width, height, rowsToCompare, threshold) {
        const rows = Math.max(2, Math.min(rowsToCompare, height));
        let best = null;
        for (let y = 0; y + rows <= height; y++) {
          const rowBits = [];
          for (let r = 0; r < rows; r++) {
            rowBits.push(buildBitsForRow(imageData, width, y + r, threshold));
          }

          let inSeg = false;
          let segStart = 0;
          for (let x = 0; x < width; x++) {
            const ref = rowBits[0][x];
            let match = true;
            for (let r = 1; r < rows; r++) {
              if (rowBits[r][x] !== ref) { match = false; break; }
            }

            if (match && !inSeg) {
              inSeg = true;
              segStart = x;
            } else if (!match && inSeg) {
              const segEnd = x - 1;
              const len = segEnd - segStart + 1;
              if (!best || len > best.len) {
                best = { xStart: segStart, xEnd: segEnd, yStart: y, rows, len };
              }
              inSeg = false;
            }
          }
          if (inSeg) {
            const segEnd = width - 1;
            const len = segEnd - segStart + 1;
            if (!best || len > best.len) {
              best = { xStart: segStart, xEnd: segEnd, yStart: y, rows, len };
            }
          }
        }
        return best;
      }

      function findUPCInModules(modules, moduleX, baseModule) {
        const N = modules.length;
        if (N < 95) return null;

        for (let i = 0; i + 95 <= N; i++) {
          const window = modules.slice(i, i + 95);
          const decoded = decodeUpcFromModules(window.split(""));
          if (decoded) {
            const leftCenter = moduleX[i];
            const rightCenter = moduleX[i + 94];
            const xStart = leftCenter - baseModule * 0.5;
            const xEnd = rightCenter + baseModule * 0.5;
            return { code: decoded, xStart, xEnd, i };
          }
        }
        return null;
      }

      function detectUPCInChunk(imageData, width, height, threshold) {
        const mid = Math.floor(height / 2);
        const offsets = [0, -2, 2, -5, 5, -9, 9, -14, 14];
        const rows = [];
        for (const o of offsets) {
          const y = mid + o;
          if (y >= 0 && y < height) rows.push(y);
        }

        let best = null;

        for (const y of rows) {
          const built = buildModulesForRow(imageData, width, y, 0, width, threshold);
          if (!built) continue;

          const hit = findUPCInModules(built.modules, built.moduleX, built.baseModule);
          if (!hit) continue;

          const span = hit.xEnd - hit.xStart;
          const score = span + built.baseModule * 10;

          if (!best || score > best.score) {
            best = {
              code: hit.code,
              xStart: Math.max(0, hit.xStart),
              xEnd: Math.min(width - 1, hit.xEnd),
              yStart: Math.max(0, y - Math.floor(height * 0.35)),
              yEnd: Math.min(height - 1, y + Math.floor(height * 0.35)),
              score
            };
          }
        }

        return best;
      }

      // ===== ZXing wrapper =====
      function ensureZXing() {
        if (!zxingReader && window.ZXing && window.ZXing.BrowserMultiFormatReader) {
          zxingReader = new window.ZXing.BrowserMultiFormatReader();
        }
      }

      function setStatus(text) {
        statusEl.innerHTML = "Status: <strong>" + text + "</strong>";
      }

      function pickDefaultCameraId(cams) {
        const byLabel = cams.find(cam => {
          const label = (cam.label || "").toLowerCase();
          return label.includes("back") || label.includes("rear") || label.includes("environment");
        });
        return (byLabel && byLabel.deviceId) || (cams[0] && cams[0].deviceId) || "";
      }

      async function listCameras() {
        const devices = await navigator.mediaDevices.enumerateDevices();
        cameraSelect.innerHTML = "";
        const cams = devices.filter(d => d.kind === "videoinput");
        cams.forEach((cam, i) => {
          const opt = document.createElement("option");
          opt.value = cam.deviceId;
          opt.textContent = cam.label || "Camera " + (i + 1);
          cameraSelect.appendChild(opt);
        });
        if (!cams.length) {
          const opt = document.createElement("option");
          opt.textContent = "No camera found";
          cameraSelect.appendChild(opt);
        } else {
          cameraSelect.value = pickDefaultCameraId(cams);
        }
      }

      async function startCamera() {
        try {
          if (stream) stopCamera();
          const deviceId = cameraSelect.value;
          stream = await navigator.mediaDevices.getUserMedia({
            video: deviceId
              ? { deviceId: { exact: deviceId } }
              : { facingMode: { ideal: "environment" } },
            audio: false
          });
          video.srcObject = stream;
          setStatus("Camera running");
          resizeOverlay();
          startProcessing();
        } catch (err) {
          console.error(err);
          setStatus("Camera error: " + err.message);
        }
      }

      function stopCamera() {
        if (rafId) {
          cancelAnimationFrame(rafId);
          rafId = 0;
        }
        if (stream) {
          stream.getTracks().forEach(t => t.stop());
          stream = null;
        }
        video.srcObject = null;
        setStatus("Stopped");
      }

      function resizeOverlay() {
        const rect = video.getBoundingClientRect();
        overlay.width = Math.max(1, Math.floor(rect.width));
        overlay.height = Math.max(1, Math.floor(rect.height));
        overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
      }

      function resetBuffers(width, height) {
        frameCanvas.width = width;
        frameCanvas.height = height;
        vizCanvas.width = width;
        vizCanvas.height = height;
        prevBand = null;
      }

      function startProcessing() {
        if (rafId) cancelAnimationFrame(rafId);

        const loop = () => {
          rafId = requestAnimationFrame(loop);
          if (!video.videoWidth || !video.videoHeight) return;

          if (frameCanvas.width !== video.videoWidth || frameCanvas.height !== video.videoHeight) {
            resetBuffers(video.videoWidth, video.videoHeight);
          }

          const w = frameCanvas.width;
          const h = frameCanvas.height;
          const y0 = Math.max(0, Math.floor((h - bandHeight) / 2));

          frameCtx.drawImage(video, 0, 0, w, h);
          const band = frameCtx.getImageData(0, y0, w, bandHeight);
          const data = band.data;

          if (!prevBand || prevBand.length !== data.length) {
            prevBand = new Uint8ClampedArray(data);
            return;
          }

          const rowsToCompare = Number(rowCompareCountEl.value);
          const intensityThreshold = Number(intensityThresholdEl.value);
          const highlightX = new Uint8Array(w);
          const bestSeg = findBestRowMatchSegment(data, w, bandHeight, rowsToCompare, intensityThreshold);
          if (bestSeg) {
            for (let x = bestSeg.xStart; x <= bestSeg.xEnd; x++) highlightX[x] = 1;
          }

          countReadoutEl.innerHTML =
            "Matching rows: <strong>" + (bestSeg ? bestSeg.rows + " / " + rowsToCompare : "—") + "</strong>";

          const adjustedChunks = bestSeg
            ? [{ xStart: bestSeg.xStart, xEnd: bestSeg.xEnd }]
            : [];

          // Visualization: green overlay for candidate x-ranges
          const viz = vizCtx.createImageData(w, h);
          const vizData = viz.data;
          for (let y = 0; y < bandHeight; y++) {
            for (let x = 0; x < w; x++) {
              if (!highlightX[x]) continue;
              const vi = ((y0 + y) * w + x) * 4;
              vizData[vi] = 0;
              vizData[vi + 1] = 255;
              vizData[vi + 2] = 0;
              vizData[vi + 3] = 180;
            }
          }
          vizCtx.putImageData(viz, 0, 0);

          overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
          overlayCtx.drawImage(vizCanvas, 0, 0, overlay.width, overlay.height);

          // Decode at interval
          const now = performance.now();
          if (now - lastDecodeTime >= decodeIntervalMs) {
            lastDecodeTime = now;

            // --- CUSTOM (chunk-based UPC) ---
            if (useCustomEl.checked && adjustedChunks.length) {
              let bestHit = null;
              let bestChunk = null;

              for (const chunk of adjustedChunks) {
                const cw = Math.max(1, chunk.xEnd - chunk.xStart + 1);
                const img = frameCtx.getImageData(chunk.xStart, y0, cw, bandHeight);
                const hit = detectUPCInChunk(img.data, cw, bandHeight, intensityThreshold);

                if (hit) {
                  bestHit = hit;
                  bestChunk = chunk;
                  break; // first good hit; remove to search all chunks
                }
              }

              if (bestHit && bestChunk) {
                customOutputEl.innerHTML = "Custom: <strong>" + bestHit.code + "</strong>";

                // draw tight rectangle around UPC window inside the chunk
                const scaleX = overlay.width / frameCanvas.width;
                const scaleY = overlay.height / frameCanvas.height;

                const gx0 = (bestChunk.xStart + bestHit.xStart) * scaleX;
                const gx1 = (bestChunk.xStart + bestHit.xEnd) * scaleX;
                const gy0 = (y0 + bestHit.yStart) * scaleY;
                const gy1 = (y0 + bestHit.yEnd) * scaleY;

                overlayCtx.save();
                overlayCtx.strokeStyle = "rgba(255, 220, 0, 0.95)";
                overlayCtx.lineWidth = 3;
                overlayCtx.strokeRect(gx0, gy0, Math.max(1, gx1 - gx0), Math.max(1, gy1 - gy0));
                overlayCtx.restore();
              } else {
                customOutputEl.innerHTML = "Custom: <strong>—</strong>";
              }
            } else {
              customOutputEl.innerHTML = "Custom: <strong>—</strong>";
            }

            // --- ZXING ---
            if (useZXingEl.checked && adjustedChunks.length) {
              ensureZXing();
              if (!zxingReader || pendingZXing) {
                if (!zxingReader) zxingOutputEl.innerHTML = "ZXing: <strong>—</strong>";
              } else {
                pendingZXing = true;
                (async () => {
                  let zxingValue = null;
                  for (const chunk of adjustedChunks) {
                    const cw = Math.max(1, chunk.xEnd - chunk.xStart + 1);
                    const img = frameCtx.getImageData(chunk.xStart, y0, cw, bandHeight);
                    try {
                      const result = await zxingReader.decodeFromImageData(img);
                      if (result && result.text) { zxingValue = result.text; break; }
                    } catch (_) {}
                  }
                  if (useZXingEl.checked) {
                    zxingOutputEl.innerHTML = "ZXing: <strong>" + (zxingValue || "—") + "</strong>";
                  }
                  pendingZXing = false;
                })();
              }
            } else {
              zxingOutputEl.innerHTML = "ZXing: <strong>—</strong>";
            }
          }

          prevBand.set(data);
        };

        loop();
      }

      startBtn.addEventListener("click", startCamera);
      stopBtn.addEventListener("click", stopCamera);
      window.addEventListener("resize", resizeOverlay);

      rowCompareCountEl.addEventListener("input", () => {
        rowCompareCountVal.textContent = rowCompareCountEl.value;
      });
      intensityThresholdEl.addEventListener("input", () => {
        intensityThresholdVal.textContent = intensityThresholdEl.value;
      });

      navigator.mediaDevices.addEventListener("devicechange", listCameras);

      listCameras()
        .then(() => startCamera())
        .catch(() => setStatus("No camera access"));
    </script>
  </body>
</html>
