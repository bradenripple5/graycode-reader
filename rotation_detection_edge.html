<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rotation Detection via Edge Geometry</title>
  <style>
    body { font-family: sans-serif; margin: 20px; background: #f3f3f3; }
    .panel { max-width: 900px; margin: 0 auto; background: #fff; padding: 16px; border-radius: 8px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
    .angle-big { font-size: 20px; font-weight: 700; }
    .toggle-btn { width: 34px; height: 34px; font-size: 20px; line-height: 1; }
    #advancedControls { display: none; }
    canvas { width: 100%; background: #111; border-radius: 6px; }
    .mid-bits {
      margin-top: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 9px;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: clip;
      color: #222;
    }
  </style>
</head>
<body>
  <div class="panel">
    <h2>Rotation Detection via Edge Geometry</h2>
    <div class="row">
      <button id="collapseBtn" class="toggle-btn" title="Show/Hide controls">+</button>
      <span id="houghAvg" class="angle-big">Angle: -</span>
    </div>
    <div id="advancedControls" class="row">
      <label>Threshold <input id="thr" type="range" min="20" max="220" value="80" /></label>
      <label>hough avg window <span id="houghWindowVal">5</span> <input id="houghWindow" type="range" min="1" max="30" value="5" /></label>
      <label>MC points <span id="mcPointsVal">1200</span> <input id="mcPoints" type="range" min="100" max="5000" step="50" value="1200" /></label>
      <label>intersections target <span id="intersectionTargetVal">300</span> <input id="intersectionTarget" type="range" min="20" max="1200" step="10" value="300" /></label>
      <label><input id="mcMode" type="checkbox" /> binary monte carlo</label>
      <label><input id="checkerMode" type="checkbox" /> checker run-length angle</label>
      <label><input id="intersectionMode" type="checkbox" /> checker intersections</label>
      <label><input id="centerPerpMode" type="checkbox" checked /> find- perpendicular vectors along center column</label>
      <label><input id="justEdges" type="checkbox" /> just edge detection</label>
      <label><input id="justHough" type="checkbox" /> just hough (make sure the vertical bars are the only thing in view)</label>
      <span id="detectStatus">Status: idle</span>
      <span id="redUp">Red Up: -</span>
      <span id="binStats">Binary: -</span>
      <span id="intersectionStats">Intersections: -</span>
      <span id="lineAngles">Angles: -</span>
      <span id="lineAvg">Lines(20) Gaussian Avg: -</span>
      <span id="barAvg">Bars(10) Avg: -</span>
    </div>
    <canvas id="cv" width="900" height="560"></canvas>
    <div id="midBits" class="mid-bits">mid row bits: -</div>
  </div>
  <video id="video" playsinline style="display:none"></video>

  <script>
    const video = document.getElementById('video');
    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');
    const collapseBtn = document.getElementById('collapseBtn');
    const advancedControls = document.getElementById('advancedControls');
    const thrEl = document.getElementById('thr');
    const houghWindowEl = document.getElementById('houghWindow');
    const houghWindowValEl = document.getElementById('houghWindowVal');
    const mcPointsEl = document.getElementById('mcPoints');
    const mcPointsValEl = document.getElementById('mcPointsVal');
    const intersectionTargetEl = document.getElementById('intersectionTarget');
    const intersectionTargetValEl = document.getElementById('intersectionTargetVal');
    const mcModeEl = document.getElementById('mcMode');
    const checkerModeEl = document.getElementById('checkerMode');
    const intersectionModeEl = document.getElementById('intersectionMode');
    const centerPerpModeEl = document.getElementById('centerPerpMode');
    const justEdgesEl = document.getElementById('justEdges');
    const justHoughEl = document.getElementById('justHough');
    const detectStatusEl = document.getElementById('detectStatus');
    const redUpEl = document.getElementById('redUp');
    const binStatsEl = document.getElementById('binStats');
    const intersectionStatsEl = document.getElementById('intersectionStats');
    const lineAnglesEl = document.getElementById('lineAngles');
    const lineAvgEl = document.getElementById('lineAvg');
    const houghAvgEl = document.getElementById('houghAvg');
    const barAvgEl = document.getElementById('barAvg');
    const midBitsEl = document.getElementById('midBits');
    const THRESHOLD_KEY = 'edge_detection_threshold_v1';
    const SETTINGS_KEY = 'rotation_detection_settings_v3';

    const work = document.createElement('canvas');
    const wctx = work.getContext('2d', { willReadFrequently: true });
    let stream = null, raf = null;
    const roi = { x: 0, y: 0, w: 0, h: 0 };
    let edgeSmooth = null, edgeSmoothW = 0, edgeSmoothH = 0;
    const LINE_COUNT = 20;
    const LINE_HISTORY_LEN = 5;
    const LINE_OUTLIER_DELTA = 20;
    const LINE_GAUSS_SIGMA_DEG = 12;
    const angleHistory = Array.from({ length: LINE_COUNT }, () => []);
    const houghHistory = [];

    function gaussianBlurGray(gray, w, h) {
      const tmp = new Float32Array(w * h);
      const out = new Uint8Array(w * h);
      for (let y = 0; y < h; y++) {
        const row = y * w;
        for (let x = 0; x < w; x++) {
          const xm1 = x > 0 ? x - 1 : x;
          const xp1 = x + 1 < w ? x + 1 : x;
          tmp[row + x] = (gray[row + xm1] + 2 * gray[row + x] + gray[row + xp1]) * 0.25;
        }
      }
      for (let y = 0; y < h; y++) {
        const ym1 = y > 0 ? y - 1 : y;
        const yp1 = y + 1 < h ? y + 1 : y;
        for (let x = 0; x < w; x++) {
          const v = (tmp[ym1 * w + x] + 2 * tmp[y * w + x] + tmp[yp1 * w + x]) * 0.25;
          out[y * w + x] = v;
        }
      }
      return out;
    }

    function sobelEdges(gray, w, h, thr) {
      const out = new Uint8ClampedArray(w * h * 4);
      for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
          const i = y * w + x;
          const gx = -gray[i - w - 1] - 2 * gray[i - 1] - gray[i + w - 1] + gray[i - w + 1] + 2 * gray[i + 1] + gray[i + w + 1];
          const gy = -gray[i - w - 1] - 2 * gray[i - w] - gray[i - w + 1] + gray[i + w - 1] + 2 * gray[i + w] + gray[i + w + 1];
          const mag = Math.abs(gx) + Math.abs(gy);
          const v = mag > thr * 8 ? 255 : 0;
          const p = i * 4;
          out[p] = v; out[p + 1] = v; out[p + 2] = v; out[p + 3] = 255;
        }
      }
      return out;
    }

    function buildBinaryBoundary(gray, w, h, thr) {
      const bin = new Uint8Array(w * h);
      for (let i = 0; i < gray.length; i++) bin[i] = gray[i] >= thr ? 1 : 0;
      const out = new Uint8ClampedArray(w * h * 4);
      const points = [];
      for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
          const i = y * w + x;
          const b = bin[i];
          const edge =
            b !== bin[i + 1] || b !== bin[i - 1] ||
            b !== bin[i + w] || b !== bin[i - w];
          const p = i * 4;
          const v = edge ? 255 : 0;
          out[p] = v; out[p + 1] = v; out[p + 2] = v; out[p + 3] = 255;
          if (edge) points.push({ x, y });
        }
      }
      return { edgeRgba: out, points };
    }

    function sampleRandomPoints(points, n) {
      if (points.length <= n) return points.slice();
      const out = [];
      const used = new Set();
      while (out.length < n) {
        const i = (Math.random() * points.length) | 0;
        if (used.has(i)) continue;
        used.add(i);
        out.push(points[i]);
      }
      return out;
    }

    function buildBinaryFromGray(gray, thr) {
      const b = new Uint8Array(gray.length);
      for (let i = 0; i < gray.length; i++) b[i] = gray[i] >= thr ? 1 : 0;
      return b;
    }

    function binaryBounds(bin, w, h) {
      const col = new Uint16Array(w);
      const row = new Uint16Array(h);
      for (let y = 0; y < h; y++) {
        const yy = y * w;
        for (let x = 0; x < w; x++) {
          if (!bin[yy + x]) continue;
          col[x]++; row[y]++;
        }
      }
      const minColCount = Math.max(2, Math.floor(h * 0.03));
      const minRowCount = Math.max(2, Math.floor(w * 0.03));
      let x0 = 0, x1 = w - 1, y0 = 0, y1 = h - 1;
      while (x0 < w && col[x0] < minColCount) x0++;
      while (x1 > x0 && col[x1] < minColCount) x1--;
      while (y0 < h && row[y0] < minRowCount) y0++;
      while (y1 > y0 && row[y1] < minRowCount) y1--;
      if (x1 - x0 < 8 || y1 - y0 < 8) return null;
      return { x0, x1, y0, y1 };
    }

    function bitsFromRow(bin, w, y, x0, x1) {
      const width = Math.max(1, x1 - x0 + 1);
      let out = '';
      for (let i = 0; i < width; i++) {
        const x = x0 + i;
        if (x < 0 || x >= w) continue;
        out += bin[y * w + x] ? '1' : '0';
      }
      return out;
    }

    function binaryToRgba(bin, w, h) {
      const out = new Uint8ClampedArray(w * h * 4);
      for (let i = 0, p = 0; i < bin.length; i++, p += 4) {
        const v = bin[i] ? 255 : 0;
        out[p] = v; out[p + 1] = v; out[p + 2] = v; out[p + 3] = 255;
      }
      return out;
    }

    function redUpInfo(redCentroid, w, h) {
      if (!redCentroid) return null;
      const cx = w * 0.5, cy = h * 0.5;
      const dx = redCentroid.x - cx;
      const dy = redCentroid.y - cy;
      let dir = 'up';
      if (Math.abs(dx) > Math.abs(dy)) dir = dx >= 0 ? 'right' : 'left';
      else dir = dy >= 0 ? 'down' : 'up';
      // atan2 uses y-down image coords. Convert so "up" reads as 90 degrees.
      const raw = normalize360((Math.atan2(dy, dx) * 180) / Math.PI);
      const up90 = normalize360(raw + 180);
      return { dir, up90 };
    }

    function runLengthsOnLine(bin, w, h, cx, cy, angDeg, samples = 220) {
      const r = (angDeg * Math.PI) / 180;
      const dx = Math.cos(r), dy = Math.sin(r);
      const span = Math.hypot(w, h) * 0.5;
      const step = (span * 2) / samples;
      let prev = -1, run = 0;
      const runs = [];
      for (let i = 0; i <= samples; i++) {
        const t = -span + i * step;
        const x = Math.round(cx + dx * t);
        const y = Math.round(cy + dy * t);
        if (x < 0 || y < 0 || x >= w || y >= h) continue;
        const v = bin[y * w + x];
        if (prev < 0) {
          prev = v;
          run = 1;
        } else if (v === prev) {
          run++;
        } else {
          runs.push(run);
          prev = v;
          run = 1;
        }
      }
      if (run > 0) runs.push(run);
      return runs;
    }

    function scoreRuns(runs) {
      if (!runs || runs.length < 8) return -1e9;
      let sum = 0;
      for (let i = 0; i < runs.length; i++) sum += runs[i];
      const mean = sum / runs.length;
      if (mean < 1.5 || mean > 40) return -1e9;
      let varSum = 0;
      for (let i = 0; i < runs.length; i++) {
        const d = runs[i] - mean;
        varSum += d * d;
      }
      const std = Math.sqrt(varSum / runs.length);
      const consistency = mean / (std + 1e-3);
      const transitions = runs.length - 1;
      return consistency * Math.min(transitions, 80);
    }

    function estimateCheckerAngle(gray, w, h, thr, redCentroid = null) {
      const bin = buildBinaryFromGray(gray, thr);
      const cx = w * 0.5, cy = h * 0.5;
      const offsets = [-0.22, -0.1, 0, 0.1, 0.22];

      function scoreAngle(ang) {
        let total = 0;
        for (let i = 0; i < offsets.length; i++) {
          const rr = ((ang + 90) * Math.PI) / 180;
          const ox = Math.cos(rr) * offsets[i] * w;
          const oy = Math.sin(rr) * offsets[i] * h;
          const runs = runLengthsOnLine(bin, w, h, cx + ox, cy + oy, ang, 220);
          total += scoreRuns(runs);
        }
        return total / offsets.length;
      }

      let bestAng = 0, bestScore = -1e18;
      for (let a = 0; a < 180; a += 2) {
        const s = scoreAngle(a);
        if (s > bestScore) { bestScore = s; bestAng = a; }
      }
      for (let a = bestAng - 3; a <= bestAng + 3; a += 1) {
        const aa = ((a % 180) + 180) % 180;
        const s = scoreAngle(aa);
        if (s > bestScore) { bestScore = s; bestAng = aa; }
      }

      // Convert axis estimate into full orientation using red marker direction.
      if (redCentroid) {
        const redAng = normalize360((Math.atan2(redCentroid.y - cy, redCentroid.x - cx) * 180) / Math.PI);
        const candidates = [
          normalize360(bestAng),
          normalize360(bestAng + 180),
          normalize360(bestAng - 90),
          normalize360(bestAng + 90),
        ];
        let best = candidates[0], bestD = 1e9;
        for (let i = 0; i < candidates.length; i++) {
          const predRed = normalize360(candidates[i] - 90);
          const d = angleDelta360(predRed, redAng);
          if (d < bestD) { bestD = d; best = candidates[i]; }
        }
        return best;
      }
      return normalize360(bestAng);
    }

    function estimateAngleFromGrid10(gray, w, h, thr, redCentroid = null) {
      const bin = buildBinaryFromGray(gray, thr);
      const cx = w * 0.5, cy = h * 0.5;
      const offs = [];
      for (let i = 0; i < 10; i++) offs.push(-0.42 + (0.84 * i) / 9); // 10 rows/cols

      function scoreAt(ang) {
        let sRow = 0, sCol = 0;
        const nr = ((ang + 90) * Math.PI) / 180;
        const nx = Math.cos(nr), ny = Math.sin(nr);
        for (let i = 0; i < offs.length; i++) {
          const ox = nx * offs[i] * w;
          const oy = ny * offs[i] * h;
          const r1 = runLengthsOnLine(bin, w, h, cx + ox, cy + oy, ang, 220);       // rows-like
          const r2 = runLengthsOnLine(bin, w, h, cx + ox, cy + oy, ang + 90, 220);  // cols-like
          sRow += scoreRuns(r1);
          sCol += scoreRuns(r2);
        }
        return (sRow + sCol) * 0.5;
      }

      let bestAng = 0, bestScore = -1e18;
      for (let a = 0; a < 180; a += 2) {
        const s = scoreAt(a);
        if (s > bestScore) { bestScore = s; bestAng = a; }
      }
      for (let a = bestAng - 3; a <= bestAng + 3; a += 1) {
        const aa = ((a % 180) + 180) % 180;
        const s = scoreAt(aa);
        if (s > bestScore) { bestScore = s; bestAng = aa; }
      }

      if (redCentroid) {
        const redAng = normalize360((Math.atan2(redCentroid.y - cy, redCentroid.x - cx) * 180) / Math.PI);
        const cands = [
          normalize360(bestAng),
          normalize360(bestAng + 180),
          normalize360(bestAng - 90),
          normalize360(bestAng + 90),
        ];
        let best = cands[0], bestD = 1e9;
        for (let i = 0; i < cands.length; i++) {
          const predRed = normalize360(cands[i] - 90);
          const d = angleDelta360(predRed, redAng);
          if (d < bestD) { bestD = d; best = cands[i]; }
        }
        return best;
      }
      return normalize360(bestAng);
    }

    function drawGrid10Overlay(rx0, ry0, rw, rh) {
      ctx.save();
      ctx.lineWidth = 1.2;
      // 10 evenly spaced horizontal lines.
      ctx.strokeStyle = 'rgba(255, 210, 60, 0.9)';
      for (let i = 0; i < 10; i++) {
        const y = ry0 + ((i + 0.5) * rh) / 10;
        ctx.beginPath();
        ctx.moveTo(rx0, y);
        ctx.lineTo(rx0 + rw, y);
        ctx.stroke();
      }
      // 10 evenly spaced vertical lines.
      ctx.strokeStyle = 'rgba(80, 190, 255, 0.9)';
      for (let i = 0; i < 10; i++) {
        const x = rx0 + ((i + 0.5) * rw) / 10;
        ctx.beginPath();
        ctx.moveTo(x, ry0);
        ctx.lineTo(x, ry0 + rh);
        ctx.stroke();
      }
      ctx.restore();
    }

    function monteCarloBinaryLines(points, samplePoints, maxLines = 10, redCentroid = null) {
      if (!points || points.length < 30) return [];
      const pool = sampleRandomPoints(points, Math.max(40, samplePoints));
      const attempts = Math.max(120, pool.length * 2);
      const candidates = [];

      for (let it = 0; it < attempts; it++) {
        const i = (Math.random() * pool.length) | 0;
        const j = (Math.random() * pool.length) | 0;
        if (i === j) continue;
        const p1 = pool[i], p2 = pool[j];
        const dx = p2.x - p1.x, dy = p2.y - p1.y;
        const len = Math.hypot(dx, dy);
        if (len < 10) continue;
        const ux = dx / len, uy = dy / len;
        const nx = -uy, ny = ux;
        let inliers = 0, minT = 1e9, maxT = -1e9;
        for (let k = 0; k < pool.length; k++) {
          const q = pool[k];
          const rx = q.x - p1.x, ry = q.y - p1.y;
          const dist = Math.abs(rx * nx + ry * ny);
          if (dist <= 1.8) {
            inliers++;
            const t = rx * ux + ry * uy;
            if (t < minT) minT = t;
            if (t > maxT) maxT = t;
          }
        }
        const span = maxT - minT;
        if (inliers < Math.max(10, pool.length * 0.06) || span < 22) continue;
        const x1 = p1.x + ux * minT, y1 = p1.y + uy * minT;
        const x2 = p1.x + ux * maxT, y2 = p1.y + uy * maxT;
        const ang180 = (((Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI) % 180) + 180) % 180;
        const rho = ((x1 + x2) * 0.5) * nx + ((y1 + y2) * 0.5) * ny;
        candidates.push({ x1, y1, x2, y2, len: span, score: span + inliers * 0.45, ang180, rho });
      }

      if (!candidates.length) return [];
      candidates.sort((a, b) => b.score - a.score);
      const out = [];
      for (let i = 0; i < candidates.length && out.length < maxLines; i++) {
        const c = candidates[i];
        let ok = true;
        for (let j = 0; j < out.length; j++) {
          if (angleDelta180(c.ang180, out[j].ang180) < 6 && Math.abs(c.rho - out[j].rho) < 10) {
            ok = false; break;
          }
        }
        if (!ok) continue;
        let { x1, y1, x2, y2 } = c;
        if (redCentroid) {
          const d1 = (x1 - redCentroid.x) * (x1 - redCentroid.x) + (y1 - redCentroid.y) * (y1 - redCentroid.y);
          const d2 = (x2 - redCentroid.x) * (x2 - redCentroid.x) + (y2 - redCentroid.y) * (y2 - redCentroid.y);
          if (d1 > d2) {
            const tx = x1, ty = y1;
            x1 = x2; y1 = y2; x2 = tx; y2 = ty;
          }
        }
        out.push({
          x1, y1, x2, y2, len: c.len, ang180: c.ang180, rho: c.rho,
          ang360: normalize360((Math.atan2(y2 - y1, x2 - x1) * 180) / Math.PI)
        });
      }
      return out;
    }

    function detectCheckerIntersections(bin, w, h, maxPts = 300) {
      function median(arr) {
        if (!arr.length) return 0;
        const a = arr.slice().sort((x, y) => x - y);
        const m = (a.length / 2) | 0;
        return (a.length & 1) ? a[m] : 0.5 * (a[m - 1] + a[m]);
      }
      function angle180(deg) {
        let a = deg % 180;
        if (a < 0) a += 180;
        return a;
      }
      function localCheckerScore(x, y, r = 3) {
        if (x < r + 1 || y < r + 1 || x >= w - r - 1 || y >= h - r - 1) return -1;
        let q1 = 0, q2 = 0, q3 = 0, q4 = 0, n = 0;
        for (let oy = -r; oy <= r; oy++) {
          for (let ox = -r; ox <= r; ox++) {
            if (ox === 0 || oy === 0) continue;
            const v = bin[(y + oy) * w + (x + ox)];
            if (ox > 0 && oy < 0) q1 += v;
            else if (ox < 0 && oy < 0) q2 += v;
            else if (ox < 0 && oy > 0) q3 += v;
            else q4 += v;
            n++;
          }
        }
        const nq = n / 4;
        const m1 = q1 / nq, m2 = q2 / nq, m3 = q3 / nq, m4 = q4 / nq;
        const diagAErr = Math.abs(m1 - m3);
        const diagBErr = Math.abs(m2 - m4);
        const adjMin = Math.min(Math.abs(m1 - m2), Math.abs(m1 - m4), Math.abs(m3 - m2), Math.abs(m3 - m4));
        if (diagAErr > 0.38 || diagBErr > 0.38 || adjMin < 0.2) return -1;

        // 6x6-ish continuation check: center row/col should flip multiple times.
        let th = 0, tv = 0, ph = -1, pv = -1;
        for (let t = -r; t <= r; t++) {
          const vh = bin[y * w + (x + t)];
          const vv = bin[(y + t) * w + x];
          if (ph >= 0 && vh !== ph) th++;
          if (pv >= 0 && vv !== pv) tv++;
          ph = vh;
          pv = vv;
        }
        if (th < 2 || tv < 2) return -1;
        return (adjMin * 6) + (2 - diagAErr - diagBErr) + (th + tv) * 0.4;
      }
      function estimateAxesAndSpacing(points) {
        if (points.length < 6) return null;
        const hist = new Float32Array(180);
        const nnDist = [];
        for (let i = 0; i < points.length; i++) {
          let best = 1e9;
          const near = [];
          for (let j = 0; j < points.length; j++) {
            if (i === j) continue;
            const dx = points[j].x - points[i].x;
            const dy = points[j].y - points[i].y;
            const d = Math.hypot(dx, dy);
            if (d < 2 || d > Math.min(w, h) * 0.45) continue;
            near.push({ dx, dy, d });
            if (d < best) best = d;
          }
          if (best < 1e9) nnDist.push(best);
          near.sort((a, b) => a.d - b.d);
          for (let k = 0; k < Math.min(6, near.length); k++) {
            const a = angle180((Math.atan2(near[k].dy, near[k].dx) * 180) / Math.PI);
            hist[Math.round(a) % 180] += 1 / (near[k].d + 1e-3);
          }
        }
        if (!nnDist.length) return null;
        let peak = 0, bestV = -1;
        for (let i = 0; i < 180; i++) {
          const v = hist[(i + 179) % 180] + hist[i] + hist[(i + 1) % 180];

          { x: -ax.dir1.x, y: -ax.dir1.y },
          { x: ax.dir2.x, y: ax.dir2.y },
          { x: -ax.dir2.x, y: -ax.dir2.y }
        ];

        let bestScore = -1e9;

        const inSet = new Uint8Array(points.length);
        const queue = [seed];

            const dy = points[i].y - ty;
            const d = Math.hypot(dx, dy);
            if (d < bd) { bd = d; bi = i; }

            const ty = p.y + dirs[k].y * ax.d0;

    function temporalSmoothEdges(edgeRgba, w, h, alpha = 0.35, onThresh = 140) {

        edgeSmoothH = h;

    function connectedEdgeComponents(edgeRgba, w, h, minSize = 40) {

    function extractLongestLines(edgeRgba, w, h, maxLines = 5) {

    function extractVerticalBars(edgeRgba, w, h, maxBars = 10) {

      for (let i = 0; i < peaks.length && selected.length < maxBars; i++) {
        let ok = true;
        for (let j = 0; j < selected.length; j++) {
          if (Math.abs(peaks[i].x - selected[j].x) < 8) { ok = false; break; }
        }
        if (ok) selected.push(peaks[i]);
      }

      const bars = [];
      for (let i = 0; i < selected.length; i++) {
        const x0 = selected[i].x;
        let n = 0, sumY = 0, sumX = 0, sumYY = 0, sumYX = 0;
        let yMin = 1e9, yMax = -1e9;
        for (let k = 0; k < pts.length; k++) {
          const p = pts[k];
          if (Math.abs(p.x - x0) > 3) continue;
          n++; sumY += p.y; sumX += p.x; sumYY += p.y * p.y; sumYX += p.y * p.x;
          if (p.y < yMin) yMin = p.y;
          if (p.y > yMax) yMax = p.y;
        }
        if (n < 25 || yMax - yMin < 20) continue;
        const den = n * sumYY - sumY * sumY;
        const a = Math.abs(den) < 1e-6 ? 0 : (n * sumYX - sumY * sumX) / den; // x = a*y + b
        const b = (sumX - a * sumY) / n;
        const x1 = a * yMin + b, x2 = a * yMax + b;
        const len = Math.hypot(x2 - x1, yMax - yMin);
        const ang = (((Math.atan2(yMax - yMin, x2 - x1) * 180 / Math.PI) % 180) + 180) % 180;
        bars.push({ x1, y1: yMin, x2, y2: yMax, len, ang });
      }
      bars.sort((a, b) => b.len - a.len);
      return bars.slice(0, maxBars);
    }

    function averageAngles180(angles) {
      if (!angles.length) return null;
      let s = 0, c = 0;
      for (let i = 0; i < angles.length; i++) {
        const r = (angles[i] * 2 * Math.PI) / 180;
        s += Math.sin(r);
        c += Math.cos(r);
      }
      let a = (Math.atan2(s, c) * 180) / Math.PI / 2;
      if (a < 0) a += 180;
      return a;
    }

    function houghAverageAngle(edgeRgba, w, h, maxLines = 5, redCentroid = null) {
      const pts = [];
      for (let y = 1; y < h - 1; y += 2) {
        for (let x = 1; x < w - 1; x += 2) {
          const p = (y * w + x) * 4;
          if (edgeRgba[p] > 0) pts.push({ x, y });
        }
      }
      if (pts.length < 60) return null;
      while (pts.length > 3200) pts.splice((Math.random() * pts.length) | 0, 1);

      const thetaBins = 180;
      const rhoMax = Math.ceil(Math.hypot(w, h));
      const rhoBins = rhoMax * 2 + 1;
      const acc = new Uint16Array(thetaBins * rhoBins);
      const cosT = new Float32Array(thetaBins);
      const sinT = new Float32Array(thetaBins);
      for (let t = 0; t < thetaBins; t++) {
        const r = (t * Math.PI) / 180;
        cosT[t] = Math.cos(r);
        sinT[t] = Math.sin(r);
      }

      for (let i = 0; i < pts.length; i++) {
        const x = pts[i].x, y = pts[i].y;
        for (let t = 0; t < thetaBins; t++) {
          const rho = Math.round(x * cosT[t] + y * sinT[t]) + rhoMax;
          acc[t * rhoBins + rho] += 1;
        }
      }

      const peaks = [];
      for (let t = 0; t < thetaBins; t++) {
        for (let r = 1; r < rhoBins - 1; r++) {
          const v = acc[t * rhoBins + r];
          if (v < 20) continue;
          if (v < acc[t * rhoBins + r - 1] || v < acc[t * rhoBins + r + 1]) continue;
          peaks.push({ t, r, v });
        }
      }
      if (!peaks.length) return null;
      peaks.sort((a, b) => b.v - a.v);
      const picked = [];
      for (let i = 0; i < peaks.length && picked.length < maxLines; i++) {
        let ok = true;
        for (let j = 0; j < picked.length; j++) {
          if (Math.abs(peaks[i].t - picked[j].t) < 4 && Math.abs(peaks[i].r - picked[j].r) < 14) { ok = false; break; }
        }
        if (ok) picked.push(peaks[i]);
      }
      if (!picked.length) return null;

      const angles = [];
      for (let i = 0; i < picked.length; i++) {
        const t = picked[i].t;
        const ct = cosT[t], st = sinT[t];
        const rho = picked[i].r - rhoMax;
        const ptsOnBorder = [];
        if (Math.abs(st) > 1e-6) {
          let y = (rho - 0 * ct) / st;
          if (y >= 0 && y <= h - 1) ptsOnBorder.push({ x: 0, y });
          y = (rho - (w - 1) * ct) / st;
          if (y >= 0 && y <= h - 1) ptsOnBorder.push({ x: w - 1, y });
        }
        if (Math.abs(ct) > 1e-6) {
          let x = (rho - 0 * st) / ct;
          if (x >= 0 && x <= w - 1) ptsOnBorder.push({ x, y: 0 });
          x = (rho - (h - 1) * st) / ct;
          if (x >= 0 && x <= w - 1) ptsOnBorder.push({ x, y: h - 1 });
        }
        if (ptsOnBorder.length < 2) continue;
        let p1 = ptsOnBorder[0], p2 = ptsOnBorder[1], bestD = -1;
        for (let a = 0; a < ptsOnBorder.length; a++) {
          for (let b = a + 1; b < ptsOnBorder.length; b++) {
            const dx = ptsOnBorder[b].x - ptsOnBorder[a].x;
            const dy = ptsOnBorder[b].y - ptsOnBorder[a].y;
            const d = dx * dx + dy * dy;
            if (d > bestD) { bestD = d; p1 = ptsOnBorder[a]; p2 = ptsOnBorder[b]; }
          }
        }

        if (redCentroid) {
          const d1 = (p1.x - redCentroid.x) * (p1.x - redCentroid.x) + (p1.y - redCentroid.y) * (p1.y - redCentroid.y);
          const d2 = (p2.x - redCentroid.x) * (p2.x - redCentroid.x) + (p2.y - redCentroid.y) * (p2.y - redCentroid.y);
          const tip = d1 <= d2 ? p1 : p2;
          const tail = d1 <= d2 ? p2 : p1;
          angles.push(normalize360((Math.atan2(tip.y - tail.y, tip.x - tail.x) * 180) / Math.PI));
        } else {
          angles.push(((t + 90) % 180 + 180) % 180);
        }
      }
      if (!angles.length) return null;

      if (redCentroid) {
        const seed = averageAngles360(angles);
        const filtered = angles.filter((a) => angleDelta360(a, seed) <= 20);
        return averageAngles360(filtered.length ? filtered : angles);
      }
      const seed = averageAngles180(angles);
      const filtered = angles.filter((a) => angleDelta180(a, seed) <= 20);
      return averageAngles180(filtered.length ? filtered : angles);
    }

    function detectRedCentroid(d, frameW, rx0, ry0, rw, rh) {
      let sx = 0, sy = 0, n = 0;
      for (let y = 0; y < rh; y++) {
        const fy = ry0 + y;
        for (let x = 0; x < rw; x++) {
          const fx = rx0 + x;
          const p = (fy * frameW + fx) * 4;
          const r = d[p], g = d[p + 1], b = d[p + 2];
          if (r > 150 && r - g > 55 && r - b > 55) {
            sx += x;
            sy += y;
            n++;
          }
        }
      }
      if (n < 10) return null;
      return { x: sx / n, y: sy / n };
    }

    function smoothHough(frameAngle) {
      function gaussianPdf(x, mu, sigma) {
        const s = Math.max(1e-6, sigma);
        const z = (x - mu) / s;
        return (1 / (s * Math.sqrt(2 * Math.PI))) * Math.exp(-0.5 * z * z);
      }
      const win = Math.max(1, parseInt(houghWindowEl.value, 10) || 5);
      houghWindowValEl.textContent = String(win);
      if (frameAngle === null || frameAngle === undefined) {
        houghHistory.length = 0;
        return null;
      }
      houghHistory.push(frameAngle);
      if (houghHistory.length > win) houghHistory.splice(0, houghHistory.length - win);
      const n = houghHistory.length;
      const mu = 0; // newest sample age
      const sigma = Math.max(0.8, win / 3);
      let s = 0, c = 0;
      for (let i = 0; i < n; i++) {
        const age = (n - 1) - i; // newest sample has age 0
        const w = gaussianPdf(age, mu, sigma);
        const r = (houghHistory[i] * Math.PI) / 180;
        s += Math.sin(r) * w;
        c += Math.cos(r) * w;
      }
      return normalize360((Math.atan2(s, c) * 180) / Math.PI);
    }

    function process() {
      try {
        if (!video.videoWidth) {
          detectStatusEl.textContent = 'Status: waiting for camera frame';
          return;
        }
        cv.width = 900;
        cv.height = Math.round(900 * video.videoHeight / video.videoWidth);
        roi.w = cv.width * 0.5;
        roi.h = cv.height * 0.5;
        roi.x = (cv.width - roi.w) / 2;
        roi.y = (cv.height - roi.h) / 2;
        clampRoi();
        work.width = cv.width;
        work.height = cv.height;
        wctx.drawImage(video, 0, 0, work.width, work.height);
        const frame = wctx.getImageData(0, 0, work.width, work.height);
        const d = frame.data;
        const rx0 = roi.x | 0, ry0 = roi.y | 0, rx1 = (roi.x + roi.w) | 0, ry1 = (roi.y + roi.h) | 0;
        const rw = Math.max(2, rx1 - rx0);
        const rh = Math.max(2, ry1 - ry0);
        const gray = new Uint8Array(rw * rh);
        for (let y = 0; y < rh; y++) {
          const sy = ry0 + y;
          for (let x = 0; x < rw; x++) {
            const sx = rx0 + x;
            const p = (sy * work.width + sx) * 4;
            gray[y * rw + x] = (d[p] * 30 + d[p + 1] * 59 + d[p + 2] * 11) / 100;
          }
        }
        const thr = parseInt(thrEl.value, 10);
        const bin = buildBinaryFromGray(gray, thr);
        const midY = Math.floor(rh * 0.5);
        const midBits = bitsFromRow(bin, rw, midY, 0, rw - 1);
        midBitsEl.textContent = `mid row bits: ${midBits}`;
        const binaryRgba = binaryToRgba(bin, rw, rh);
        let ones = 0;
        for (let i = 0; i < bin.length; i++) ones += bin[i];
        const zeros = bin.length - ones;
        binStatsEl.textContent = `Binary: 1s=${ones} 0s=${zeros}`;
        let edgeRgba;
        let edgeCount = 0;
        let mcLines = [];
        if (mcModeEl.checked || checkerModeEl.checked || intersectionModeEl.checked || centerPerpModeEl.checked) {
          const bb = buildBinaryBoundary(gray, rw, rh, thr);
          edgeRgba = bb.edgeRgba;
          edgeCount = bb.points.length;
        } else {
          const blurred = gaussianBlurGray(gray, rw, rh);
          edgeRgba = sobelEdges(blurred, rw, rh, thr);
          temporalSmoothEdges(edgeRgba, rw, rh);
          for (let i = 0; i < edgeRgba.length; i += 4) if (edgeRgba[i] > 0) edgeCount++;
        }
        detectStatusEl.textContent = edgeCount > 0 ? `Status: edges detected (${edgeCount})` : 'Status: no edges detected';
        const redCentroid = detectRedCentroid(d, work.width, rx0, ry0, rw, rh);
        const upInfo = redUpInfo(redCentroid, rw, rh);
        redUpEl.textContent = upInfo ? `Red Up: ${upInfo.dir} (${upInfo.up90.toFixed(1)}°)` : 'Red Up: -';
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, cv.width, cv.height);
        // In checker mode, show pure thresholded 0/1 image for verification.
        const viewRgba = (checkerModeEl.checked || intersectionModeEl.checked || centerPerpModeEl.checked) ? binaryRgba : edgeRgba;
        ctx.putImageData(new ImageData(viewRgba, rw, rh), rx0, ry0);
        if (justEdgesEl.checked) {
          for (let i = 0; i < LINE_COUNT; i++) angleHistory[i].length = 0;
          houghHistory.length = 0;
          lineAnglesEl.textContent = 'Angles: -';
          lineAvgEl.textContent = `Lines(${LINE_COUNT}) Gaussian Avg: -`;
          houghAvgEl.textContent = 'Angle: -';
          barAvgEl.textContent = 'Bars(10) Avg: -';
          intersectionStatsEl.textContent = 'Intersections: -';
          drawRoiOverlay();
          return;
        }
        if (intersectionModeEl.checked) {
          const targetPts = Math.max(20, parseInt(intersectionTargetEl.value, 10) || 300);
          const pts = detectCheckerIntersections(bin, rw, rh, targetPts);
          intersectionStatsEl.textContent = `Intersections: ${pts.length}`;
          const ia = estimateAngleFromIntersections(pts, rw, rh, redCentroid);
          houghAvgEl.textContent = ia === null ? 'Angle: -' : `Angle: ${displayAngle(ia).toFixed(1)}°`;
          lineAnglesEl.textContent = ia === null ? 'Angles: -' : `Angles: intersections=${displayAngle(ia).toFixed(1)}°`;
          lineAvgEl.textContent = ia === null ? 'Intersection Avg: -' : `Intersection Avg: ${displayAngle(ia).toFixed(1)}°`;
          barAvgEl.textContent = 'Bars(10) Avg: -';
          ctx.save();
          ctx.fillStyle = 'rgba(255,40,40,0.95)';
          for (let i = 0; i < pts.length; i++) ctx.fillRect(rx0 + pts[i].x - 2, ry0 + pts[i].y - 2, 5, 5);
          ctx.restore();
          drawRoiOverlay();
          return;
        }
        if (centerPerpModeEl.checked) {
          const res = angleFromCenterPerp(bin, rw, rh, redCentroid);
          houghAvgEl.textContent = res.angle === null ? 'Angle: -' : `Angle: ${displayAngle(res.angle).toFixed(1)}°`;
          lineAnglesEl.textContent = res.angle === null ? 'Angles: -' : `Angles: center-perp=${displayAngle(res.angle).toFixed(1)}°`;
          lineAvgEl.textContent = res.angle === null ? 'Center-Perp Avg: -' : `Center-Perp Avg: ${displayAngle(res.angle).toFixed(1)}°`;
          barAvgEl.textContent = 'Bars(10) Avg: -';
          intersectionStatsEl.textContent = `Intersections: ${res.segments.length}`;
          ctx.save();
          ctx.strokeStyle = 'rgba(255,60,60,0.98)';
          ctx.lineWidth = 2.4;
          for (let i = 0; i < res.segments.length; i++) {
            const s = res.segments[i];
            ctx.beginPath();
            ctx.moveTo(rx0 + s.x1, ry0 + s.y1);
            ctx.lineTo(rx0 + s.x2, ry0 + s.y2);
            ctx.stroke();
          }
          // show the center column guide
          ctx.strokeStyle = 'rgba(80,220,255,0.9)';
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.moveTo(rx0 + ((rw * 0.5) | 0), ry0);
          ctx.lineTo(rx0 + ((rw * 0.5) | 0), ry0 + rh);
          ctx.stroke();
          ctx.restore();
          drawRoiOverlay();
          return;
        }
        if (checkerModeEl.checked) {
          const checkerRaw = estimateAngleFromGrid10(gray, rw, rh, thr, redCentroid);
          houghAvgEl.textContent = checkerRaw === null ? 'Angle: -' : `Angle: ${displayAngle(checkerRaw).toFixed(1)}°`;
          lineAnglesEl.textContent = checkerRaw === null ? 'Angles: -' : `Angles: grid10=${displayAngle(checkerRaw).toFixed(1)}°`;
          lineAvgEl.textContent = checkerRaw === null ? 'Grid(10x10) Avg: -' : `Grid(10x10) Avg: ${displayAngle(checkerRaw).toFixed(1)}°`;
          barAvgEl.textContent = 'Bars(10) Avg: -';
          intersectionStatsEl.textContent = 'Intersections: -';
          drawGrid10Overlay(rx0, ry0, rw, rh);
          drawRoiOverlay();
          return;
        }
        if (mcModeEl.checked) {
          const bb = buildBinaryBoundary(gray, rw, rh, thr);
          mcLines = monteCarloBinaryLines(
            bb.points,
            Math.max(100, parseInt(mcPointsEl.value, 10) || 1200),
            LINE_COUNT,
            redCentroid
          );
          if (mcLines.length) {
            const colors = ['#ff5555', '#55ff55', '#5599ff', '#ffd84d', '#ff7dff'];
            const angleTexts = [];
            const angles = [];
            const lens = [];
            ctx.save();
            ctx.lineWidth = 2.2;
            for (let i = 0; i < mcLines.length; i++) {
              const ln = mcLines[i];
              angles.push(ln.ang360);
              lens.push(ln.len);
              angleTexts.push(`${i + 1}:${displayAngle(ln.ang360).toFixed(1)}°`);
              ctx.strokeStyle = colors[i % colors.length];
              ctx.beginPath();
              ctx.moveTo(rx0 + ln.x1, ry0 + ln.y1);
              ctx.lineTo(rx0 + ln.x2, ry0 + ln.y2);
              ctx.stroke();
              ctx.fillStyle = '#ff2a2a';
              ctx.fillRect(rx0 + ln.x2 - 3, ry0 + ln.y2 - 3, 6, 6);
            }
            ctx.restore();
            const preview = angleTexts.slice(0, 10).join('  ');
            lineAnglesEl.textContent = angleTexts.length > 10 ? `Angles: ${preview} ...` : `Angles: ${preview}`;
            const mcAvg = gaussianWeightedAverageAngles360(angles, lens, LINE_GAUSS_SIGMA_DEG);
            lineAvgEl.textContent = `MC Lines(${mcLines.length}) Gaussian Avg: ${displayAngle(mcAvg).toFixed(1)}°`;
            houghAvgEl.textContent = `Angle: ${displayAngle(mcAvg).toFixed(1)}°`;
          } else {
            lineAnglesEl.textContent = 'Angles: -';
            lineAvgEl.textContent = `MC Lines(${LINE_COUNT}) Gaussian Avg: -`;
            houghAvgEl.textContent = 'Angle: -';
          }
          barAvgEl.textContent = 'Bars(10) Avg: -';
          intersectionStatsEl.textContent = 'Intersections: -';
          drawRoiOverlay();
          return;
        }
        const houghRawFrame = houghAverageAngle(edgeRgba, rw, rh, 5, redCentroid);

        if (justHoughEl.checked) {
          for (let i = 0; i < LINE_COUNT; i++) angleHistory[i].length = 0;
          lineAnglesEl.textContent = 'Angles: -';
          lineAvgEl.textContent = `Lines(${LINE_COUNT}) Gaussian Avg: -`;
          barAvgEl.textContent = 'Bars(10) Avg: -';
          const houghAvg = smoothHough(houghRawFrame);
          houghAvgEl.textContent = houghAvg === null ? 'Angle: -' : `Angle: ${displayAngle(houghAvg).toFixed(1)}°`;
          intersectionStatsEl.textContent = 'Intersections: -';
          drawRoiOverlay();
          return;
        }
        const lines = extractLongestLines(edgeRgba, rw, rh, LINE_COUNT);
        let usedHoughFallbackForLines = false;
        if (lines.length) {
          const colors = ['#ff5555', '#55ff55', '#5599ff', '#ffd84d', '#ff7dff'];
          const angleTexts = [];
          const smoothAngles = [];
          const lineLens = [];
          ctx.save();
          ctx.lineWidth = 2.2;
          for (let i = 0; i < lines.length; i++) {
            const ln = lines[i];
            let x1 = ln.x1, y1 = ln.y1, x2 = ln.x2, y2 = ln.y2;
            // Orient line direction toward red end-caps when present.
            if (redCentroid) {
              const mx = (x1 + x2) * 0.5;
              const my = (y1 + y2) * 0.5;
              const vx = x2 - x1;
              const vy = y2 - y1;
              const toRedX = redCentroid.x - mx;
              const toRedY = redCentroid.y - my;
              if (vx * toRedX + vy * toRedY < 0) {
                const tx = x1, ty = y1;
                x1 = x2; y1 = y2;
                x2 = tx; y2 = ty;
              }
            }
            const ang = normalize360((Math.atan2(y2 - y1, x2 - x1) * 180) / Math.PI);
            const avgAng = pushAngleAverage(i, ang, LINE_HISTORY_LEN, LINE_OUTLIER_DELTA);
            smoothAngles.push(avgAng);
            lineLens.push(ln.len);
            angleTexts.push(`${i + 1}:${displayAngle(avgAng).toFixed(1)}°`);
            ctx.strokeStyle = colors[i % colors.length];
            ctx.beginPath();
            ctx.moveTo(rx0 + x1, ry0 + y1);
            ctx.lineTo(rx0 + x2, ry0 + y2);
            ctx.stroke();
            // Draw red box at oriented "top" end.
            ctx.fillStyle = '#ff2a2a';
            ctx.fillRect(rx0 + x2 - 3, ry0 + y2 - 3, 6, 6);
          }
          for (let i = lines.length; i < LINE_COUNT; i++) angleHistory[i].length = 0;
          ctx.restore();
          const preview = angleTexts.slice(0, 10).join('  ');
          lineAnglesEl.textContent = angleTexts.length > 10 ? `Angles: ${preview} ...` : `Angles: ${preview}`;
          const lineAvg = gaussianWeightedAverageAngles360(smoothAngles, lineLens, LINE_GAUSS_SIGMA_DEG);
          lineAvgEl.textContent = `Lines(${lines.length}) Gaussian Avg: ${displayAngle(lineAvg).toFixed(1)}°`;
        } else {
          for (let i = 0; i < LINE_COUNT; i++) angleHistory[i].length = 0;
          lineAnglesEl.textContent = 'Angles: -';
          usedHoughFallbackForLines = true;
        }
        if (redCentroid) {
          ctx.fillStyle = '#ff2a2a';
          ctx.fillRect(rx0 + redCentroid.x - 4, ry0 + redCentroid.y - 4, 8, 8);
        }

        const bars = extractVerticalBars(edgeRgba, rw, rh, 10);
        if (bars.length) {
          const rawAngles = bars.map((b) => b.ang);
          const seed = averageAngles180(rawAngles);
          const filtered = rawAngles.filter((a) => angleDelta180(a, seed) <= 20);
          const avg = averageAngles180(filtered.length ? filtered : rawAngles);
          ctx.save();
          ctx.lineWidth = 1.8;
          ctx.strokeStyle = 'rgba(255, 120, 40, 0.95)';
          for (let i = 0; i < bars.length; i++) {
            const b = bars[i];
            ctx.beginPath();
            ctx.moveTo(rx0 + b.x1, ry0 + b.y1);
            ctx.lineTo(rx0 + b.x2, ry0 + b.y2);
            ctx.stroke();
          }
          ctx.restore();
          barAvgEl.textContent = `Bars(${bars.length}) Avg: ${avg.toFixed(1)}°`;
        } else {
          barAvgEl.textContent = 'Bars(10) Avg: -';
        }
        const houghAvg = smoothHough(houghRawFrame);
        houghAvgEl.textContent = houghAvg === null ? 'Angle: -' : `Angle: ${displayAngle(houghAvg).toFixed(1)}°`;
        intersectionStatsEl.textContent = 'Intersections: -';
        if (usedHoughFallbackForLines) {
          lineAvgEl.textContent = houghAvg === null
            ? `Lines(${LINE_COUNT}) Gaussian Avg: -`
            : `Lines(${lines.length}) Gaussian Avg (Hough fallback): ${displayAngle(houghAvg).toFixed(1)}°`;
        }
        drawRoiOverlay();
      } catch (e) {
        // Keep the loop alive across transient camera/canvas failures on mobile.
      } finally {
        if (video.srcObject) raf = requestAnimationFrame(process);
      }
    }

    async function startCamera() {
      if (stream) return;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } } });
        video.srcObject = stream;
        await video.play();
        cancelAnimationFrame(raf);
        process();
      } catch (e) {
        alert('Camera error: ' + e.message);
      }
    }

    function stopCamera() {
      if (stream) stream.getTracks().forEach(t => t.stop());
      stream = null;
      video.srcObject = null;
      detectStatusEl.textContent = 'Status: stopped';
      cancelAnimationFrame(raf);
      edgeSmooth = null;
      for (let i = 0; i < LINE_COUNT; i++) angleHistory[i].length = 0;
      houghHistory.length = 0;
      lineAnglesEl.textContent = 'Angles: -';
      lineAvgEl.textContent = `Lines(${LINE_COUNT}) Gaussian Avg: -`;
      houghAvgEl.textContent = 'Angle: -';
      barAvgEl.textContent = 'Bars(10) Avg: -';
      midBitsEl.textContent = 'mid row bits: -';
      redUpEl.textContent = 'Red Up: -';
      binStatsEl.textContent = 'Binary: -';
      intersectionStatsEl.textContent = 'Intersections: -';
      ctx.fillStyle = '#111';
      ctx.fillRect(0, 0, cv.width, cv.height);
    }

    thrEl.oninput = () => {
      try { localStorage.setItem(THRESHOLD_KEY, thrEl.value); } catch (e) {}
      persistSettings();
      if (video.srcObject) {
        cancelAnimationFrame(raf);
        process();
      }
    };
    houghWindowEl.oninput = () => {
      houghWindowValEl.textContent = houghWindowEl.value;
      persistSettings();
      if (video.srcObject) {
        cancelAnimationFrame(raf);
        process();
      }
    };
    mcPointsEl.oninput = () => {
      mcPointsValEl.textContent = mcPointsEl.value;
      persistSettings();
      if (video.srcObject) {
        cancelAnimationFrame(raf);
        process();
      }
    };
    intersectionTargetEl.oninput = () => {
      intersectionTargetValEl.textContent = intersectionTargetEl.value;
      persistSettings();
      if (video.srcObject) {
        cancelAnimationFrame(raf);
        process();
      }
    };
    mcModeEl.onchange = () => {
      if (mcModeEl.checked) { justHoughEl.checked = false; checkerModeEl.checked = false; intersectionModeEl.checked = false; centerPerpModeEl.checked = false; }
      persistSettings();
      if (video.srcObject) {
        cancelAnimationFrame(raf);
        process();
      }
    };
    checkerModeEl.onchange = () => {
      if (checkerModeEl.checked) { justHoughEl.checked = false; mcModeEl.checked = false; intersectionModeEl.checked = false; centerPerpModeEl.checked = false; }
      persistSettings();
      if (video.srcObject) {
        cancelAnimationFrame(raf);
        process();
      }
    };
    intersectionModeEl.onchange = () => {
      if (intersectionModeEl.checked) { justHoughEl.checked = false; mcModeEl.checked = false; checkerModeEl.checked = false; centerPerpModeEl.checked = false; }
      persistSettings();
      if (video.srcObject) {
        cancelAnimationFrame(raf);
        process();
      }
    };
    centerPerpModeEl.onchange = () => {
      if (centerPerpModeEl.checked) { justHoughEl.checked = false; mcModeEl.checked = false; checkerModeEl.checked = false; intersectionModeEl.checked = false; }
      persistSettings();
      if (video.srcObject) {
        cancelAnimationFrame(raf);
        process();
      }
    };
    justEdgesEl.onchange = () => {
      if (justEdgesEl.checked) justHoughEl.checked = false;
      persistSettings();
      if (video.srcObject) {
        cancelAnimationFrame(raf);
        process();
      }
    };
    justHoughEl.onchange = () => {
      if (justHoughEl.checked) { justEdgesEl.checked = false; mcModeEl.checked = false; checkerModeEl.checked = false; intersectionModeEl.checked = false; centerPerpModeEl.checked = false; }
      persistSettings();
      if (video.srcObject) {
        cancelAnimationFrame(raf);
        process();
      }
    };
    try {
      const saved = localStorage.getItem(THRESHOLD_KEY);
      if (saved !== null && saved !== '') thrEl.value = saved;
    } catch (e) {}
    function persistSettings() {
      const s = {
        houghWindow: houghWindowEl.value,
        mcPoints: mcPointsEl.value,
        intersectionTarget: intersectionTargetEl.value,
        justEdges: justEdgesEl.checked,
        justHough: justHoughEl.checked,
        mcMode: mcModeEl.checked,
        checkerMode: checkerModeEl.checked,
        intersectionMode: intersectionModeEl.checked,
        centerPerpMode: centerPerpModeEl.checked
      };
      try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); } catch (e) {}
    }

    function restoreSettings() {
      try {
        const raw = localStorage.getItem(SETTINGS_KEY);
        if (!raw) return;
        const s = JSON.parse(raw);
        if (s.houghWindow != null) houghWindowEl.value = String(s.houghWindow);
        if (s.mcPoints != null) mcPointsEl.value = String(s.mcPoints);
        if (s.intersectionTarget != null) intersectionTargetEl.value = String(s.intersectionTarget);
        justEdgesEl.checked = !!s.justEdges;
        justHoughEl.checked = !!s.justHough;
        mcModeEl.checked = !!s.mcMode;
        checkerModeEl.checked = !!s.checkerMode;
        intersectionModeEl.checked = !!s.intersectionMode;
        centerPerpModeEl.checked = !!s.centerPerpMode;

        // enforce mutual exclusivity (priority order)
        if (justHoughEl.checked) {
          justEdgesEl.checked = false; mcModeEl.checked = false; checkerModeEl.checked = false; intersectionModeEl.checked = false; centerPerpModeEl.checked = false;
        } else {
          const active = [mcModeEl.checked, checkerModeEl.checked, intersectionModeEl.checked, centerPerpModeEl.checked].filter(Boolean).length;
          if (active > 1) {
            // keep first checked in precedence: checker, center-perp, intersection, monte carlo
            const keepChecker = checkerModeEl.checked;
            const keepCenterPerp = !keepChecker && centerPerpModeEl.checked;
            const keepIntersection = !keepChecker && !keepCenterPerp && intersectionModeEl.checked;
            const keepMc = !keepChecker && !keepCenterPerp && !keepIntersection && mcModeEl.checked;
            checkerModeEl.checked = keepChecker;
            centerPerpModeEl.checked = keepCenterPerp;
            intersectionModeEl.checked = keepIntersection;
            mcModeEl.checked = keepMc;
          }
        }
      } catch (e) {}
    }

    restoreSettings();
    houghWindowValEl.textContent = houghWindowEl.value;
    mcPointsValEl.textContent = mcPointsEl.value;
    intersectionTargetValEl.textContent = intersectionTargetEl.value;
    collapseBtn.onclick = () => {
      const expanded = advancedControls.style.display !== 'none';
      advancedControls.style.display = expanded ? 'none' : 'flex';
      collapseBtn.textContent = expanded ? '+' : '-';
    };
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) stopCamera();
      else startCamera();
    });
    startCamera();
  </script>
</body>
</html>
