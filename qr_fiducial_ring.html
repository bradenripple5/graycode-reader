<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Fiducial Ring</title>
  <style>
    :root {
      --page-bg: #202124;
      --panel-bg: #f6f4ef;
      --ink: #161616;
      --muted: #5f6368;
      --accent: #1769aa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: var(--page-bg);
      color: var(--ink);
    }

    .app {
      display: grid;
      grid-template-columns: minmax(260px, 320px) 1fr;
      min-height: 100vh;
    }

    aside {
      padding: 18px;
      background: #ffffff;
      border-right: 1px solid #d8d8d8;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 22px;
    }

    .controls {
      display: grid;
      gap: 14px;
    }

    label {
      display: grid;
      gap: 5px;
      font-size: 14px;
      font-weight: 700;
    }

    input[type="range"],
    input[type="number"] {
      width: 100%;
    }

    input[type="number"] {
      padding: 8px;
      border: 1px solid #c7c7c7;
      border-radius: 4px;
      font-size: 14px;
    }

    button {
      min-height: 38px;
      border: 0;
      border-radius: 4px;
      background: var(--accent);
      color: #ffffff;
      font-size: 14px;
      cursor: pointer;
    }

    .stage-wrap {
      display: grid;
      place-items: center;
      padding: 24px;
      overflow: auto;
    }

    .sheet {
      position: relative;
      width: min(92vmin, 900px);
      aspect-ratio: 1;
      background: var(--panel-bg);
      border: 1px solid #d6d1c6;
      box-shadow: 0 10px 34px rgba(0, 0, 0, 0.28);
    }

    .disk-outline,
    .hub-outline,
    .axis-line {
      position: absolute;
      pointer-events: none;
    }

    .disk-outline {
      inset: 6%;
      border: 2px solid #2f2f2f;
      border-radius: 50%;
    }

    .hub-outline {
      inset: 42%;
      border: 2px solid #777;
      border-radius: 50%;
    }

    .axis-line {
      left: 50%;
      top: 8%;
      width: 2px;
      height: 84%;
      background: rgba(255, 0, 0, 0.55);
      transform: translateX(-50%);
    }

    .marker {
      position: absolute;
      left: var(--marker-left);
      top: var(--marker-top);
      width: var(--marker-size);
      height: var(--marker-size);
      padding: calc(var(--marker-size) * 0.08);
      background: #ffffff;
      border: 1px solid #111111;
      transform: translate(-50%, -50%) rotate(var(--marker-rotation));
      transform-origin: 50% 50%;
    }

    .marker img {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }

    .marker span {
      position: absolute;
      left: 50%;
      bottom: -18px;
      transform: translateX(-50%);
      color: #111111;
      font: 700 11px Arial, sans-serif;
    }

    .readout {
      margin-top: 14px;
      padding: 10px;
      border-radius: 4px;
      background: #f1f7ff;
      color: #06436f;
      font: 700 13px "Courier New", monospace;
      line-height: 1.5;
    }

    .reader-link {
      display: grid;
      gap: 8px;
      margin-top: 14px;
      padding: 10px;
      border: 1px solid #d8d8d8;
      border-radius: 6px;
      background: #ffffff;
    }

    .reader-link a {
      display: block;
      width: 132px;
      height: 132px;
      padding: 6px;
      background: #ffffff;
      border: 1px solid #cfcfcf;
      border-radius: 4px;
    }

    .reader-link img {
      display: block;
      width: 100%;
      height: 100%;
    }

    .reader-link div {
      overflow-wrap: anywhere;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    @media print {
      body {
        background: #ffffff;
      }
      .app {
        display: block;
      }
      aside {
        display: none;
      }
      .stage-wrap {
        padding: 0;
      }
      .sheet {
        width: 100vmin;
        box-shadow: none;
        border: 0;
      }
    }

    @media (max-width: 760px) {
      .app {
        grid-template-columns: 1fr;
      }
      aside {
        border-right: 0;
        border-bottom: 1px solid #d8d8d8;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <aside>
      <h1>QR Fiducial Ring</h1>
      <div class="controls">
        <label>
          Markers: <span id="markerCountVal">16</span>
          <input id="markerCount" type="range" min="4" max="36" value="16" step="1">
        </label>
        <label>
          Marker size: <span id="markerSizeVal">12</span>%
          <input id="markerSize" type="range" min="6" max="22" value="12" step="1">
        </label>
        <label>
          Ring radius: <span id="ringRadiusVal">36</span>%
          <input id="ringRadius" type="range" min="20" max="44" value="36" step="1">
        </label>
        <label>
          Disk ID
          <input id="diskId" type="number" min="0" max="9999" value="1">
        </label>
        <button id="printBtn">Print</button>
      </div>
      <div class="readout" id="readout"></div>
      <div class="reader-link">
        <a id="readerQrLink" href="./qr_fiducial_reader.html" title="Open QR fiducial reader">
          <img id="readerQr" alt="QR code for QR fiducial reader">
        </a>
        <div id="readerUrlText">qr_fiducial_reader.html</div>
      </div>
    </aside>

    <section class="stage-wrap">
      <div class="sheet" id="sheet">
        <div class="disk-outline"></div>
        <div class="hub-outline"></div>
        <div class="axis-line"></div>
      </div>
    </section>
  </main>

  <script>
    const sheet = document.getElementById('sheet');
    const markerCount = document.getElementById('markerCount');
    const markerCountVal = document.getElementById('markerCountVal');
    const markerSize = document.getElementById('markerSize');
    const markerSizeVal = document.getElementById('markerSizeVal');
    const ringRadius = document.getElementById('ringRadius');
    const ringRadiusVal = document.getElementById('ringRadiusVal');
    const diskId = document.getElementById('diskId');
    const printBtn = document.getElementById('printBtn');
    const readout = document.getElementById('readout');
    const readerQrLink = document.getElementById('readerQrLink');
    const readerQr = document.getElementById('readerQr');
    const readerUrlText = document.getElementById('readerUrlText');

    function qrUrl(payload) {
      return `https://api.qrserver.com/v1/create-qr-code/?size=180x180&qzone=4&data=${encodeURIComponent(payload)}`;
    }

    function isLocalHostName(hostname) {
      return hostname === 'localhost' || hostname === '127.0.0.1' || hostname === '0.0.0.0' || hostname.endsWith('.local');
    }

    async function resolveReaderUrl() {
      const url = new URL('./qr_fiducial_reader.html', window.location.href);
      if (!isLocalHostName(url.hostname)) return url.href;

      try {
        const res = await fetch('/__dev_lan_ip', { cache: 'no-store' });
        if (!res.ok) return url.href;
        const data = await res.json();
        if (!data || !data.ip) return url.href;
        const port = data.port ? `:${data.port}` : '';
        return `${data.protocol || url.protocol}//${data.ip}${port}${url.pathname}`;
      } catch (err) {
        return url.href;
      }
    }

    async function updateReaderQr() {
      const readerUrl = await resolveReaderUrl();
      readerQrLink.href = readerUrl;
      readerQrLink.title = readerUrl;
      readerUrlText.textContent = readerUrl;
      readerQr.src = qrUrl(readerUrl);
    }

    function markerPayload(id, count, index) {
      const baseAngle = (index / count) * 360;
      return `QF:${id}:${count}:${index}:${(baseAngle + 90).toFixed(3)}`;
    }

    function render() {
      const count = parseInt(markerCount.value, 10);
      const size = parseInt(markerSize.value, 10);
      const radius = parseInt(ringRadius.value, 10);
      const id = parseInt(diskId.value, 10) || 0;

      markerCountVal.textContent = count;
      markerSizeVal.textContent = size;
      ringRadiusVal.textContent = radius;
      sheet.style.setProperty('--marker-size', `${size}%`);
      sheet.querySelectorAll('.marker').forEach((node) => node.remove());

      for (let i = 0; i < count; i++) {
        const angle = (i / count) * 360;
        const rad = (angle - 90) * Math.PI / 180;
        const left = 50 + Math.cos(rad) * radius;
        const top = 50 + Math.sin(rad) * radius;
        const marker = document.createElement('div');
        const img = document.createElement('img');
        const label = document.createElement('span');
        marker.className = 'marker';
        marker.style.setProperty('--marker-left', `${left}%`);
        marker.style.setProperty('--marker-top', `${top}%`);
        marker.style.setProperty('--marker-rotation', `${angle + 90}deg`);
        img.alt = `QR marker ${i}`;
        img.src = qrUrl(markerPayload(id, count, i));
        label.textContent = i;
        marker.append(img, label);
        sheet.append(marker);
      }

      readout.textContent = `disk=${id}\nmarkers=${count}\nreader=qr_fiducial_reader.html`;
    }

    markerCount.addEventListener('input', render);
    markerSize.addEventListener('input', render);
    ringRadius.addEventListener('input', render);
    diskId.addEventListener('input', render);
    printBtn.addEventListener('click', () => window.print());

    render();
    updateReaderQr();
  </script>
</body>
</html>
