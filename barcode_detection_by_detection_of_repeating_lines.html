<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Repeating Line Barcode Detection</title>
  <style>
    :root {
      --bg: #121212;
      --panel: #1b1b1b;
      --text: #f2f2f2;
      --accent: #22c55e;
    }

    body {
      margin: 0;
      padding: 20px;
      background: var(--bg);
      color: var(--text);
      font-family: monospace;
    }

    h1 {
      margin: 0 0 16px 0;
    }

    .panel {
      background: var(--panel);
      padding: 12px;
      border-radius: 8px;
      max-width: 960px;
    }

    video {
      width: 100%;
      height: auto;
      background: #000;
      border-radius: 4px;
    }

    .controls {
      margin-bottom: 12px;
    }

    .controls label {
      margin-right: 8px;
    }

    .controls input[type="range"] {
      width: 220px;
      vertical-align: middle;
    }

    button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      margin-right: 10px;
    }

    button:disabled {
      background: #666;
      cursor: not-allowed;
    }

    canvas {
      width: 100%;
      height: auto;
      margin-top: 12px;
      background: #000;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>Repeating Line Barcode Detection</h1>

  <div class="panel">
    <div class="controls">
      <button id="startBtn">Start Camera</button>
      <button id="stopBtn" disabled>Stop Camera</button>
      <label for="repeatCount">Repeat Rows:</label>
      <input id="repeatCount" type="range" min="2" max="20" value="6" />
      <span id="repeatCountValue">6</span>
    </div>
    <video id="video" playsinline autoplay muted></video>
    <canvas id="output"></canvas>
  </div>

  <script>
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const video = document.getElementById('video');
    const repeatCount = document.getElementById('repeatCount');
    const repeatCountValue = document.getElementById('repeatCountValue');
    const output = document.getElementById('output');
    const outCtx = output.getContext('2d', { willReadFrequently: true });

    let stream = null;
    let running = false;
    let rafId = 0;

    const SHIFT_TOL = 2;
    const ROW_DIFF_TOL = 16;

    function rowDiff(gray, w, y1, y2, shift) {
      const xStart = Math.max(0, shift);
      const xEnd = w + Math.min(0, shift);
      let sum = 0;
      const offset1 = y1 * w;
      const offset2 = y2 * w + shift;
      for (let x = xStart; x < xEnd; x += 1) {
        sum += Math.abs(gray[offset1 + x] - gray[offset2 + x]);
      }
      return sum / Math.max(1, xEnd - xStart);
    }

    function findRowShift(gray, w, y, y2) {
      let best = Infinity;
      let bestShift = 0;
      for (let s = -SHIFT_TOL; s <= SHIFT_TOL; s += 1) {
        const diff = rowDiff(gray, w, y, y2, s);
        if (diff < best) {
          best = diff;
          bestShift = s;
        }
      }
      return { best, bestShift };
    }

    function isRowRepeating(gray, w, y, repeats, shiftsOut) {
      shiftsOut.length = 0;
      for (let i = 1; i < repeats; i += 1) {
        const y2 = y + i;
        const { best, bestShift } = findRowShift(gray, w, y, y2);
        if (best > ROW_DIFF_TOL) return false;
        shiftsOut.push(bestShift);
      }
      return true;
    }

    function processFrame() {
      if (!running) return;
      const w = video.videoWidth;
      const h = video.videoHeight;
      if (!w || !h) {
        rafId = requestAnimationFrame(processFrame);
        return;
      }

      if (output.width !== w || output.height !== h) {
        output.width = w;
        output.height = h;
      }

      outCtx.drawImage(video, 0, 0, w, h);
      const frame = outCtx.getImageData(0, 0, w, h);
      const data = frame.data;
      const gray = new Uint8Array(w * h);
      for (let i = 0, p = 0; i < data.length; i += 4, p += 1) {
        gray[p] = (data[i] * 0.3 + data[i + 1] * 0.59 + data[i + 2] * 0.11) | 0;
      }

      outCtx.putImageData(frame, 0, 0);
      outCtx.fillStyle = '#22c55e';
      const repeats = Number(repeatCount.value) || 2;
      const limit = h - repeats + 1;
      const shifts = [];
      for (let y = 0; y < limit; y += 1) {
        if (!isRowRepeating(gray, w, y, repeats, shifts)) continue;
        const rowOffset = y * w;
        for (let x = 0; x < w; x += 1) {
          const v = gray[rowOffset + x];
          let matches = 0;
          for (let i = 0; i < shifts.length; i += 1) {
            const y2 = y + i + 1;
            const sx = x + shifts[i];
            if (sx < 0 || sx >= w) continue;
            const v2 = gray[y2 * w + sx];
            if (Math.abs(v - v2) <= ROW_DIFF_TOL) matches += 1;
          }
          if (matches === shifts.length) {
            outCtx.fillRect(x, y, 1, 1);
          }
        }
      }

      rafId = requestAnimationFrame(processFrame);
    }

    async function startCamera() {
      stopCamera();
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment' },
        audio: false
      });
      video.srcObject = stream;
      await video.play();
      startBtn.disabled = true;
      stopBtn.disabled = false;
      running = true;
      processFrame();
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach((track) => track.stop());
        stream = null;
      }
      running = false;
      if (rafId) cancelAnimationFrame(rafId);
      startBtn.disabled = false;
      stopBtn.disabled = true;
    }

    startBtn.addEventListener('click', () => {
      startCamera().catch((err) => {
        console.error('Camera start failed:', err);
        stopCamera();
        alert('Unable to access camera. Check permissions and try again.');
      });
    });

    stopBtn.addEventListener('click', stopCamera);

    repeatCount.addEventListener('input', () => {
      repeatCountValue.textContent = repeatCount.value;
    });
  </script>
</body>
</html>
