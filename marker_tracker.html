<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Marker Tracker</title>
  <style>
    body { font-family: sans-serif; margin: 20px; background: #f3f3f3; }
    .panel { max-width: 900px; margin: 0 auto; background: #fff; padding: 16px; border-radius: 8px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
    canvas { width: 100%; background: #111; border-radius: 6px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
</head>
<body>
  <div class="panel">
    <h2>Marker Tracker (Edge + Monte Carlo Dot)</h2>
    <div class="row">
      <button id="startCam">Start Webcam</button>
      <button id="stopCam" disabled>Stop Webcam</button>
      <input id="upload" type="file" accept="image/*" />
      <label>Edge threshold <input id="edgeThr" type="range" min="20" max="220" value="70" /></label>
      <span>Angle: <span id="angleOut" class="mono">-</span></span>
    </div>
    <canvas id="cv" width="900" height="560"></canvas>
  </div>
  <video id="video" playsinline style="display:none"></video>
  <script async src="https://docs.opencv.org/4.x/opencv.js"></script>

  <script>
    const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
    const video = document.getElementById('video');
    const startCam = document.getElementById('startCam');
    const stopCam = document.getElementById('stopCam');
    const upload = document.getElementById('upload');
    const edgeThrEl = document.getElementById('edgeThr');
    const angleOut = document.getElementById('angleOut');

    const proc = document.createElement('canvas');
    const pctx = proc.getContext('2d', { willReadFrequently: true });

    let stream = null, raf = null, img = null;

    function drawSource() {
      if (video.srcObject && video.videoWidth) {
        cv.width = 900;
        cv.height = Math.round(900 * video.videoHeight / video.videoWidth);
        ctx.drawImage(video, 0, 0, cv.width, cv.height);
      } else if (img) {
        cv.width = Math.min(1000, img.width);
        cv.height = Math.round(cv.width * img.height / img.width);
        ctx.drawImage(img, 0, 0, cv.width, cv.height);
      } else {
        ctx.fillStyle = '#111'; ctx.fillRect(0, 0, cv.width, cv.height);
      }
    }

    function pointInPoly(x, y, poly) {
      let inside = false;
      for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
        const xi = poly[i].x, yi = poly[i].y, xj = poly[j].x, yj = poly[j].y;
        const hit = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / ((yj - yi) || 1e-9) + xi);
        if (hit) inside = !inside;
      }
      return inside;
    }

    function buildGray(imageData) {
      const { width: w, height: h, data } = imageData;
      const g = new Uint8Array(w * h);
      for (let i = 0, p = 0; i < g.length; i++, p += 4) g[i] = (data[p] * 30 + data[p + 1] * 59 + data[p + 2] * 11) / 100;
      return g;
    }

    function largestComponentPoints(mask, w, h) {
      for (let y = 1; y < h - 1; y++) {
        if (!mask[y * w + 1] && !mask[y * w + (w - 2)]) continue;
      }
      const vis = new Uint8Array(w * h), q = new Int32Array(w * h);
      let best = [];
      for (let i = 0; i < mask.length; i++) {
        if (!mask[i] || vis[i]) continue;
        let head = 0, tail = 0; q[tail++] = i; vis[i] = 1; const pts = [];
        while (head < tail) {
          const idx = q[head++], y = (idx / w) | 0, x = idx - y * w;
          if ((x & 1) === 0 && (y & 1) === 0) pts.push([x, y]);
          const n = [idx - 1, idx + 1, idx - w, idx + w];
          if (x === 0) n[0] = -1; if (x === w - 1) n[1] = -1; if (y === 0) n[2] = -1; if (y === h - 1) n[3] = -1;
          for (let k = 0; k < 4; k++) {
            const j = n[k];
            if (j >= 0 && mask[j] && !vis[j]) { vis[j] = 1; q[tail++] = j; }
          }
        }
        if (pts.length > best.length) best = pts;
      }
      return best;
    }

    function edgeMaskOpenCV(imageData, thr) {
      const ocv = window.cv;
      if (!ocv || !ocv.Mat || !ocv.Canny) return null;
      const src = ocv.matFromImageData(imageData);
      const gray = new ocv.Mat();
      const blur = new ocv.Mat();
      const edges = new ocv.Mat();
      ocv.cvtColor(src, gray, ocv.COLOR_RGBA2GRAY);
      ocv.GaussianBlur(gray, blur, new ocv.Size(5, 5), 1.2, 1.2, ocv.BORDER_DEFAULT);
      ocv.Canny(blur, edges, thr, thr * 2, 3, false);
      const out = new Uint8Array(imageData.width * imageData.height);
      for (let i = 0; i < out.length; i++) out[i] = edges.data[i] ? 1 : 0;
      src.delete(); gray.delete(); blur.delete(); edges.delete();
      return out;
    }

    function edgeComponent(gray, w, h, thr) {
      const mask = new Uint8Array(w * h);
      for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
          const i = y * w + x;
          const gx = -gray[i - w - 1] - 2 * gray[i - 1] - gray[i + w - 1] + gray[i - w + 1] + 2 * gray[i + 1] + gray[i + w + 1];
          const gy = -gray[i - w - 1] - 2 * gray[i - w] - gray[i - w + 1] + gray[i + w - 1] + 2 * gray[i + w] + gray[i + w + 1];
          const mag = Math.abs(gx) + Math.abs(gy);
          if (mag > thr * 8) mask[i] = 1;
        }
      }
      return largestComponentPoints(mask, w, h);
    }

    function pcaCorners(points) {
      if (points.length < 40) return null;
      let mx = 0, my = 0;
      for (const [x, y] of points) { mx += x; my += y; }
      mx /= points.length; my /= points.length;
      let sxx = 0, sxy = 0, syy = 0;
      for (const [x, y] of points) { const dx = x - mx, dy = y - my; sxx += dx * dx; sxy += dx * dy; syy += dy * dy; }
      const tr = sxx + syy, det = sxx * syy - sxy * sxy, lam = (tr + Math.sqrt(Math.max(0, tr * tr - 4 * det))) / 2;
      let ux = sxy, uy = lam - sxx;
      if (Math.abs(ux) + Math.abs(uy) < 1e-9) { ux = 1; uy = 0; }
      const un = Math.hypot(ux, uy); ux /= un; uy /= un;
      const vx = -uy, vy = ux;
      let uMin = 1e9, uMax = -1e9, vMin = 1e9, vMax = -1e9;
      for (const [x, y] of points) {
        const dx = x - mx, dy = y - my, u = dx * ux + dy * uy, v = dx * vx + dy * vy;
        if (u < uMin) uMin = u; if (u > uMax) uMax = u; if (v < vMin) vMin = v; if (v > vMax) vMax = v;
      }
      const uv = [[uMin, vMin], [uMax, vMin], [uMax, vMax], [uMin, vMax]];
      const corners = uv.map(([u, v]) => ({ x: mx + u * ux + v * vx, y: my + u * uy + v * vy }));
      const c = { x: mx, y: my };
      corners.sort((a, b) => Math.atan2(a.y - c.y, a.x - c.x) - Math.atan2(b.y - c.y, b.x - c.x));
      return corners;
    }

    function monteCarloDot(gray, w, h, corners) {
      let minX = w - 1, maxX = 0, minY = h - 1, maxY = 0;
      for (const p of corners) {
        minX = Math.max(0, Math.min(minX, Math.floor(p.x)));
        maxX = Math.min(w - 1, Math.max(maxX, Math.ceil(p.x)));
        minY = Math.max(0, Math.min(minY, Math.floor(p.y)));
        maxY = Math.min(h - 1, Math.max(maxY, Math.ceil(p.y)));
      }
      let best = null;
      for (let i = 0; i < 1200; i++) {
        const x = minX + Math.random() * (maxX - minX), y = minY + Math.random() * (maxY - minY);
        if (!pointInPoly(x, y, corners)) continue;
        const xi = x | 0, yi = y | 0, idx = yi * w + xi;
        const c = gray[idx];
        if (c < 210) continue;
        const ring = [[6,0],[-6,0],[0,6],[0,-6],[4,4],[-4,4],[4,-4],[-4,-4]];
        let rs = 0, n = 0;
        for (const [dx, dy] of ring) {
          const rx = xi + dx, ry = yi + dy;
          if (rx < 0 || ry < 0 || rx >= w || ry >= h) continue;
          rs += gray[ry * w + rx]; n++;
        }
        if (!n) continue;
        const score = c - rs / n;
        if (score > 70 && (!best || score > best.score)) best = { x, y, score };
      }
      return best;
    }

    function orientByDot(corners, dot) {
      if (!dot) return corners;
      let best = 0, bd = 1e18;
      for (let i = 0; i < 4; i++) {
        const dx = corners[i].x - dot.x, dy = corners[i].y - dot.y, d = dx * dx + dy * dy;
        if (d < bd) { bd = d; best = i; }
      }
      return [corners[best], corners[(best + 1) % 4], corners[(best + 2) % 4], corners[(best + 3) % 4]];
    }

    function process() {
      drawSource();
      const scale = cv.width > 520 ? 520 / cv.width : 1;
      proc.width = Math.max(120, Math.round(cv.width * scale));
      proc.height = Math.max(120, Math.round(cv.height * scale));
      pctx.drawImage(cv, 0, 0, proc.width, proc.height);
      const frame = pctx.getImageData(0, 0, proc.width, proc.height);
      const gray = buildGray(frame);
      const thr = parseInt(edgeThrEl.value, 10);
      const ocvMask = edgeMaskOpenCV(frame, thr);
      const edges = ocvMask
        ? largestComponentPoints(ocvMask, proc.width, proc.height)
        : edgeComponent(gray, proc.width, proc.height, thr);
      const c0 = pcaCorners(edges);

      if (!c0) { angleOut.textContent = '-'; if (video.srcObject) raf = requestAnimationFrame(process); return; }

      const dot = monteCarloDot(gray, proc.width, proc.height, c0);
      const c = orientByDot(c0, dot);
      const ang = Math.atan2(c[1].y - c[0].y, c[1].x - c[0].x) * 180 / Math.PI;
      angleOut.textContent = `${ang.toFixed(1)}°`;

      const sx = cv.width / proc.width, sy = cv.height / proc.height;
      ctx.lineWidth = 3; ctx.strokeStyle = '#00e6ff';
      ctx.beginPath();
      ctx.moveTo(c[0].x * sx, c[0].y * sy);
      for (let i = 1; i < 4; i++) ctx.lineTo(c[i].x * sx, c[i].y * sy);
      ctx.closePath(); ctx.stroke();

      ctx.strokeStyle = '#ffea00';
      ctx.beginPath();
      ctx.moveTo(c[0].x * sx, c[0].y * sy);
      ctx.lineTo(c[1].x * sx, c[1].y * sy);
      ctx.stroke();

      for (let i = 0; i < 4; i++) {
        ctx.fillStyle = i === 0 ? '#ff6b6b' : '#00ff7f';
        ctx.beginPath();
        ctx.arc(c[i].x * sx, c[i].y * sy, 5, 0, Math.PI * 2);
        ctx.fill();
      }
      if (dot) {
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(dot.x * sx, dot.y * sy, 4, 0, Math.PI * 2);
        ctx.fill();
      }

      if (video.srcObject) raf = requestAnimationFrame(process);
    }

    startCam.onclick = async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } } });
        video.srcObject = stream; await video.play();
        startCam.disabled = true; stopCam.disabled = false; img = null;
        cancelAnimationFrame(raf); process();
      } catch (e) { alert('Camera error: ' + e.message); }
    };

    stopCam.onclick = () => {
      if (stream) stream.getTracks().forEach(t => t.stop());
      stream = null; video.srcObject = null;
      startCam.disabled = false; stopCam.disabled = true;
      cancelAnimationFrame(raf);
    };

    upload.onchange = () => {
      const f = upload.files && upload.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        const im = new Image();
        im.onload = () => { img = im; stopCam.onclick(); process(); };
        im.src = r.result;
      };
      r.readAsDataURL(f);
    };

    edgeThrEl.oninput = () => { if (video.srcObject || img) process(); };
    ctx.fillStyle = '#111'; ctx.fillRect(0, 0, cv.width, cv.height);
  </script>
</body>
</html>
