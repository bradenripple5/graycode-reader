<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Fiducial Reader</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #17191c;
      color: #f2f2f2;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(270px, 340px) 1fr;
      min-height: 100vh;
    }

    aside {
      padding: 18px;
      background: #24282d;
      border-right: 1px solid #383d44;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 22px;
    }

    .controls {
      display: grid;
      gap: 12px;
    }

    button {
      min-height: 40px;
      border: 0;
      border-radius: 4px;
      background: #2c7be5;
      color: #ffffff;
      font-size: 14px;
      cursor: pointer;
    }

    button:disabled {
      background: #6b7280;
      cursor: not-allowed;
    }

    label {
      display: grid;
      gap: 5px;
      font-size: 14px;
      font-weight: 700;
    }

    input[type="range"] {
      width: 100%;
    }

    .readout {
      display: grid;
      gap: 7px;
      margin-top: 14px;
      padding: 12px;
      border-radius: 4px;
      background: #101317;
      color: #a6d5ff;
      font: 700 14px "Courier New", monospace;
      overflow-wrap: anywhere;
    }

    .stage {
      display: grid;
      place-items: center;
      padding: 18px;
      overflow: auto;
    }

    canvas {
      display: block;
      width: min(100%, 960px);
      height: auto;
      background: #050505;
      border: 1px solid #363b42;
      border-radius: 6px;
    }

    video {
      display: none;
    }

    .status {
      margin-top: 12px;
      color: #d4d4d4;
      font-size: 13px;
      line-height: 1.4;
    }

    @media (max-width: 760px) {
      .app {
        grid-template-columns: 1fr;
      }
      aside {
        border-right: 0;
        border-bottom: 1px solid #383d44;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <aside>
      <h1>QR Fiducial Reader</h1>
      <div class="controls">
        <button id="startBtn">Start Camera</button>
        <button id="stopBtn" disabled>Stop</button>
        <label>
          Downscale width: <span id="downscaleVal">480</span>
          <input id="downscale" type="range" min="240" max="960" value="480" step="40">
        </label>
        <label>
          Scan rate: <span id="scanRateVal">8</span> fps
          <input id="scanRate" type="range" min="1" max="20" value="8" step="1">
        </label>
        <label>
          Smoothing: <span id="smoothingVal">35</span>%
          <input id="smoothing" type="range" min="0" max="90" value="35" step="5">
        </label>
        <label>
          <input id="debugMode" type="checkbox">
          Debug overlay
        </label>
      </div>

      <div class="readout">
        <div>Angle: <span id="angleDisplay">n/a</span></div>
        <div>Raw: <span id="rawAngleDisplay">n/a</span></div>
        <div>Marker: <span id="markerDisplay">n/a</span></div>
        <div>Disk: <span id="diskDisplay">n/a</span></div>
        <div>QR: <span id="qrDisplay">n/a</span></div>
        <div>Engine: <span id="engineDisplay">n/a</span></div>
        <div>Scan: <span id="scanDisplay">n/a</span></div>
        <div>Payload: <span id="payloadDisplay">n/a</span></div>
        <div>Hex: <span id="hexDisplay">n/a</span></div>
      </div>

      <div class="status" id="statusText">Load the QR ring page, point the camera at any marker, then start.</div>
    </aside>

    <section class="stage">
      <video id="video" playsinline></video>
      <canvas id="preview"></canvas>
    </section>
  </main>

  <script>
    const video = document.getElementById('video');
    const preview = document.getElementById('preview');
    const ctx = preview.getContext('2d', { willReadFrequently: true });
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const downscale = document.getElementById('downscale');
    const downscaleVal = document.getElementById('downscaleVal');
    const scanRate = document.getElementById('scanRate');
    const scanRateVal = document.getElementById('scanRateVal');
    const smoothing = document.getElementById('smoothing');
    const smoothingVal = document.getElementById('smoothingVal');
    const debugMode = document.getElementById('debugMode');
    const angleDisplay = document.getElementById('angleDisplay');
    const rawAngleDisplay = document.getElementById('rawAngleDisplay');
    const markerDisplay = document.getElementById('markerDisplay');
    const diskDisplay = document.getElementById('diskDisplay');
    const qrDisplay = document.getElementById('qrDisplay');
    const engineDisplay = document.getElementById('engineDisplay');
    const scanDisplay = document.getElementById('scanDisplay');
    const payloadDisplay = document.getElementById('payloadDisplay');
    const hexDisplay = document.getElementById('hexDisplay');
    const statusText = document.getElementById('statusText');

    let stream = null;
    let timerId = null;
    let smoothedAngle = null;
    let barcodeDetector = null;
    let scanCount = 0;

    if ('BarcodeDetector' in window) {
      try {
        barcodeDetector = new BarcodeDetector({ formats: ['qr_code'] });
      } catch (err) {
        barcodeDetector = null;
      }
    }

    function updateLabels() {
      downscaleVal.textContent = downscale.value;
      scanRateVal.textContent = scanRate.value;
      smoothingVal.textContent = smoothing.value;
    }

    function setNA(message) {
      angleDisplay.textContent = 'n/a';
      rawAngleDisplay.textContent = 'n/a';
      markerDisplay.textContent = 'n/a';
      diskDisplay.textContent = 'n/a';
      qrDisplay.textContent = 'n/a';
      engineDisplay.textContent = 'n/a';
      scanDisplay.textContent = 'n/a';
      payloadDisplay.textContent = 'n/a';
      hexDisplay.textContent = 'n/a';
      statusText.textContent = message;
    }

    function setNoMarker(message) {
      angleDisplay.textContent = 'n/a';
      rawAngleDisplay.textContent = 'n/a';
      markerDisplay.textContent = 'n/a';
      diskDisplay.textContent = 'n/a';
      statusText.textContent = message;
    }

    function mod360(value) {
      return ((value % 360) + 360) % 360;
    }

    function smallestAngleDelta(from, to) {
      return ((to - from + 540) % 360) - 180;
    }

    function smoothAngle(previous, next) {
      if (previous === null) return next;
      const keep = parseInt(smoothing.value, 10) / 100;
      const delta = smallestAngleDelta(previous, next);
      return mod360(previous + delta * (1 - keep));
    }

    function parsePayload(text) {
      const compact = String(text || '').match(/^QF:(-?\d+(?:\.\d+)?):(\d+):(\d+):(-?\d+(?:\.\d+)?)$/);
      if (compact) {
        return {
          disk: Number(compact[1]),
          count: Number(compact[2]),
          index: Number(compact[3]),
          edge: Number(compact[4]),
          raw: text
        };
      }

      const parts = String(text || '').split('|');
      if (parts[0] !== 'QRFID') return null;
      const data = {};
      for (const part of parts.slice(1)) {
        const splitAt = part.indexOf('=');
        if (splitAt <= 0) continue;
        data[part.slice(0, splitAt)] = part.slice(splitAt + 1);
      }
      const index = Number(data.index);
      const count = Number(data.count);
      const disk = Number(data.disk);
      const edge = Number(data.edge);
      if (!Number.isFinite(index) || !Number.isFinite(count) || !Number.isFinite(edge)) return null;
      return { index, count, disk, edge, raw: text };
    }

    function markerEdgeAngle(location) {
      const dx = location.topRightCorner.x - location.topLeftCorner.x;
      const dy = location.topRightCorner.y - location.topLeftCorner.y;
      return mod360((Math.atan2(dy, dx) * 180) / Math.PI);
    }

    function textToHex(text) {
      const bytes = new TextEncoder().encode(String(text || ''));
      return Array.from(bytes, (byte) => byte.toString(16).padStart(2, '0')).join(' ');
    }

    function barcodeLocationToQrLocation(points) {
      if (!points || points.length < 4) return null;
      return {
        topLeftCorner: points[0],
        topRightCorner: points[1],
        bottomRightCorner: points[2],
        bottomLeftCorner: points[3]
      };
    }

    function drawQrOverlay(location) {
      const points = [
        location.topLeftCorner,
        location.topRightCorner,
        location.bottomRightCorner,
        location.bottomLeftCorner
      ];
      ctx.save();
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#00ff87';
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (const point of points.slice(1)) ctx.lineTo(point.x, point.y);
      ctx.closePath();
      ctx.stroke();

      ctx.strokeStyle = '#ff3b30';
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      ctx.lineTo(points[1].x, points[1].y);
      ctx.stroke();
      ctx.restore();
    }

    function drawDebugText(lines) {
      if (!debugMode.checked) return;
      const padding = 8;
      const lineHeight = 17;
      const text = lines.filter(Boolean);
      ctx.save();
      ctx.font = '13px Courier New, monospace';
      const width = Math.min(
        preview.width - padding * 2,
        Math.max(...text.map((line) => ctx.measureText(line).width), 160) + padding * 2
      );
      const height = text.length * lineHeight + padding * 2;
      ctx.fillStyle = 'rgba(0, 0, 0, 0.72)';
      ctx.fillRect(padding, padding, width, height);
      ctx.fillStyle = '#00ff87';
      text.forEach((line, index) => {
        ctx.fillText(line.slice(0, 120), padding * 2, padding * 2 + index * lineHeight);
      });
      ctx.restore();
    }

    function drawDebugScanFrame(lines) {
      if (!debugMode.checked) return;
      ctx.save();
      ctx.strokeStyle = 'rgba(255, 255, 0, 0.75)';
      ctx.lineWidth = 2;
      ctx.strokeRect(1, 1, preview.width - 2, preview.height - 2);
      ctx.strokeStyle = 'rgba(255, 255, 0, 0.35)';
      ctx.beginPath();
      ctx.moveTo(preview.width / 2, 0);
      ctx.lineTo(preview.width / 2, preview.height);
      ctx.moveTo(0, preview.height / 2);
      ctx.lineTo(preview.width, preview.height / 2);
      ctx.stroke();
      ctx.restore();
      drawDebugText(lines);
    }

    function scheduleNextFrame() {
      if (!stream) return;
      const fps = Math.max(1, parseInt(scanRate.value, 10));
      timerId = window.setTimeout(processFrame, Math.round(1000 / fps));
    }

    async function findQrCode(imageData) {
      if (barcodeDetector) {
        try {
          const codes = await barcodeDetector.detect(preview);
          const qrCode = codes.find((code) => code.rawValue !== undefined);
          if (qrCode) {
            const location = barcodeLocationToQrLocation(qrCode.cornerPoints);
            return {
              data: qrCode.rawValue,
              location,
              engine: 'BarcodeDetector'
            };
          }
        } catch (err) {
          barcodeDetector = null;
        }
      }

      if (typeof jsQR !== 'function') {
        return {
          data: null,
          location: null,
          engine: 'none',
          error: 'jsQR did not load. Check network access for the CDN script.'
        };
      }

      const code = jsQR(imageData.data, imageData.width, imageData.height, {
        inversionAttempts: 'attemptBoth'
      });
      if (!code) return null;
      return {
        data: code.data,
        location: code.location,
        engine: 'jsQR'
      };
    }

    async function processFrame() {
      if (!stream || !video.videoWidth || !video.videoHeight) return;
      scanCount++;

      const targetWidth = parseInt(downscale.value, 10);
      const scale = targetWidth / video.videoWidth;
      preview.width = targetWidth;
      preview.height = Math.round(video.videoHeight * scale);
      ctx.drawImage(video, 0, 0, preview.width, preview.height);

      const scanStart = performance.now();
      const imageData = ctx.getImageData(0, 0, preview.width, preview.height);
      const code = await findQrCode(imageData);
      const scanMs = Math.round(performance.now() - scanStart);
      const nativeStatus = barcodeDetector ? 'native yes' : 'native no';
      const jsqrStatus = typeof jsQR === 'function' ? 'jsQR yes' : 'jsQR no';
      scanDisplay.textContent = `#${scanCount}, ${scanMs} ms @ ${preview.width}x${preview.height}`;

      if (code && code.error) {
        qrDisplay.textContent = 'detector unavailable';
        engineDisplay.textContent = `${nativeStatus}, ${jsqrStatus}`;
        drawDebugScanFrame([
          'QR: detector unavailable',
          code.error,
          `${nativeStatus}, ${jsqrStatus}`,
          `scan: #${scanCount}, ${scanMs} ms`
        ]);
        statusText.textContent = code.error;
        scheduleNextFrame();
        return;
      }

      if (!code) {
        qrDisplay.textContent = 'none';
        engineDisplay.textContent = `${nativeStatus}, ${jsqrStatus}`;
        payloadDisplay.textContent = 'n/a';
        hexDisplay.textContent = 'n/a';
        if (debugMode.checked) {
          drawDebugScanFrame([
            'QR: none',
            `${nativeStatus}, ${jsqrStatus}`,
            `scan: #${scanCount}`,
            `scan: ${scanMs} ms`,
            `size: ${preview.width}x${preview.height}`
          ]);
        }
        statusText.textContent = 'Searching for a QR fiducial marker.';
        scheduleNextFrame();
        return;
      }

      const marker = parsePayload(code.data);
      if (code.location) drawQrOverlay(code.location);
      const hex = textToHex(code.data);
      qrDisplay.textContent = marker ? 'QRFID marker' : 'QR detected';
      engineDisplay.textContent = code.engine;
      payloadDisplay.textContent = code.data || '(empty)';
      hexDisplay.textContent = hex || '(empty)';
      drawDebugText([
        marker ? 'QR: QRFID marker' : 'QR: detected, not QRFID',
        `engine: ${code.engine}`,
        `payload: ${code.data || '(empty)'}`,
        `hex: ${hex || '(empty)'}`,
        `scan: ${scanMs} ms`,
        code.location ? `edge: ${markerEdgeAngle(code.location).toFixed(2)} deg` : 'edge: n/a'
      ]);

      if (!marker) {
        setNoMarker('QR detected, but it is not a QRFID marker from qr_fiducial_ring.html.');
        scheduleNextFrame();
        return;
      }

      if (!code.location) {
        setNoMarker('QR marker payload was detected, but this decoder did not provide marker corners.');
        scheduleNextFrame();
        return;
      }

      const observedEdge = markerEdgeAngle(code.location);
      const rawDiskAngle = mod360(observedEdge - marker.edge);
      smoothedAngle = smoothAngle(smoothedAngle, rawDiskAngle);

      angleDisplay.textContent = `${smoothedAngle.toFixed(2)} deg`;
      rawAngleDisplay.textContent = `${rawDiskAngle.toFixed(2)} deg`;
      markerDisplay.textContent = `${marker.index} / ${marker.count - 1}`;
      diskDisplay.textContent = Number.isFinite(marker.disk) ? String(marker.disk) : 'n/a';
      statusText.textContent = 'Green outline is the detected marker. Red edge is the measured marker top edge.';

      scheduleNextFrame();
    }

    async function startCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 1280, height: 720, facingMode: 'environment' }
        });
        video.srcObject = stream;
        await video.play();
        startBtn.disabled = true;
        stopBtn.disabled = false;
        smoothedAngle = null;
        scanCount = 0;
        processFrame();
      } catch (err) {
        setNA(`Error: ${err.message}`);
      }
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach((track) => track.stop());
        stream = null;
      }
      if (timerId) {
        clearTimeout(timerId);
        timerId = null;
      }
      video.srcObject = null;
      startBtn.disabled = false;
      stopBtn.disabled = true;
      setNA('Stopped.');
    }

    startBtn.addEventListener('click', startCamera);
    stopBtn.addEventListener('click', stopCamera);
    downscale.addEventListener('input', updateLabels);
    scanRate.addEventListener('input', updateLabels);
    smoothing.addEventListener('input', updateLabels);

    updateLabels();
  </script>
</body>
</html>
